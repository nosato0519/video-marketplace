<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History — Video Market</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;border-radius:8px;padding:9px 12px;text-decoration:none}.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.panel{background:#12161b;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px}.muted{color:#9aa4af}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}th{font-size:11px;color:#9aa4af;text-transform:uppercase}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#20262d}.error{padding:12px;border:1px solid #733;border-radius:8px;color:#f5b7b7}.empty{padding:30px 0}@media(max-width:700px){.top{flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Order History</h1><p class="muted">Your purchases and their current status.</p></div><div class="actions"><a class="btn" href="/account.html">My Account</a><a class="btn primary" href="/library.html">My Library</a><a class="btn" href="/">Storefront</a></div></header><section class="panel"><div id="message"></div><div id="content" class="muted">Loading…</div></section></main><script>
const content=document.getElementById('content'),message=document.getElementById('message');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/orders',{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401)throw Error('Please log in to view your order history.');if(!r.ok)throw Error(d.error?.message||d.error||'Unable to load order history');const items=d.items||[];if(!items.length){content.innerHTML='<div class="empty">No orders yet.</div>';return}content.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Order</th><th>Product</th><th>Amount</th><th>Currency</th><th>Status</th><th>Purchased</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.id||x.order_id||'—')}</td><td>${esc(x.title||x.product_title||x.product_id||'Untitled')}</td><td>${esc(x.amount??x.total_amount??'—')}</td><td>${esc(x.currency||'')}</td><td><span class="status">${esc(x.status||'')}</span></td><td>${esc(x.purchased_at||x.created_at||'')}</td></tr>`).join('')}</tbody></table></div>`}catch(e){message.innerHTML='<p class="error">'+esc(e.message)+'</p>';content.innerHTML='' }}load();
</script></body></html>
