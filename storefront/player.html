<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Player</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#111}.wrap{max-width:1100px;margin:auto;padding:24px 18px}a{color:#fff}.panel{background:#fff;border-radius:12px;padding:18px;margin-top:14px}.video{width:100%;max-height:70vh;background:#000;display:block}.muted{color:#69717d}.error{color:#b00020}.btn{display:inline-block;padding:9px 12px;border-radius:8px;border:1px solid #d7dce2;text-decoration:none;color:#171a1f;background:#fff}</style></head><body><main class="wrap"><a href="/storefront/library.html">← My Library</a><section class="panel"><div id="state">Loading…</div><video id="video" class="video" controls playsinline preload="metadata" hidden></video><p id="note" class="muted"></p></section></main><script>
const id=new URLSearchParams(location.search).get('productId'),state=document.getElementById('state'),video=document.getElementById('video'),note=document.getElementById('note');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!id){state.innerHTML='<span class="error">Missing product.</span>';return}try{const r=await fetch('/api/library',{credentials:'same-origin'});if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}const d=await r.json();const item=(d.items||[]).find(x=>String(x.product_id)===String(id));if(!item){state.innerHTML='<span class="error">This video is not in your library.</span>';return}if(!item.streaming_enabled){state.innerHTML='<span class="error">Streaming is not enabled for this purchase.</span>';return}state.textContent=item.title;video.src='/api/media/'+encodeURIComponent(id)+'/stream';video.hidden=false;note.textContent='Playback is authorized by your account. The video source is served through the protected media endpoint.'}catch(e){state.innerHTML='<span class="error">'+esc(e.message)+'</span>'}}load();
</script></body></html>
