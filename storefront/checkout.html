<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:36px 20px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:14px;padding:24px}.btn{border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:11px 15px;cursor:pointer}.primary{background:#11151a;color:#fff;border-color:#11151a;width:100%;margin-top:18px}.summary{border-bottom:1px solid #edf0f2;padding-bottom:16px;margin-bottom:16px}.price{font-size:26px;font-weight:800}.muted{color:#69717d}.error{color:#a22}.steps{display:flex;gap:8px;font-size:12px;margin-bottom:20px}.step{padding:7px 10px;border:1px solid #e1e5e9;border-radius:999px}.active{font-weight:700}</style></head><body><main class="wrap"><a class="btn" href="/storefront/catalog.html">← Back</a><div class="steps"><span class="step active">1 Review</span><span class="step">2 Payment</span><span class="step">3 Library</span></div><section class="panel"><h1>Checkout</h1><div id="summary">Loading…</div><button id="continue" class="btn primary" disabled>Continue to secure payment</button><p id="msg" class="muted" role="status"></p></section></main><script>
const productId=new URLSearchParams(location.search).get('productId'),summary=document.getElementById('summary'),btn=document.getElementById('continue'),msg=document.getElementById('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!productId){msg.textContent='Missing product.';return}const r=await fetch('/api/catalog/products/'+encodeURIComponent(productId)+'?locale='+encodeURIComponent(localStorage.getItem('marketplace.locale')||navigator.language||'en'));const p=await r.json();if(!r.ok){msg.textContent=p.error?.message||'Unable to load product.';return}summary.innerHTML=`<div class="summary"><h2>${esc(p.title)}</h2><p class="muted">${esc(p.seller||'')}</p><div class="price">${esc(p.price_currency)} ${esc(p.price_amount)}</div></div><p class="muted">You will be asked to sign in before an order is created. Payment is handled by the marketplace checkout provider.</p>`;btn.disabled=false}btn.onclick=async()=>{btn.disabled=true;msg.textContent='Creating order…';try{const r=await fetch('/api/orders',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId})});const d=await r.json();if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}if(!r.ok)throw Error(d.error?.message||d.error?.code||'Unable to create order');const c=await fetch('/api/orders/'+encodeURIComponent(d.order.id)+'/checkout',{method:'POST',credentials:'same-origin'});const cd=await c.json();if(!c.ok)throw Error(cd.error?.message||cd.error?.code||'Unable to start checkout');if(cd.session?.url)location.href=cd.session.url;else if(cd.session?.checkoutUrl)location.href=cd.session.checkoutUrl;else throw Error('Payment session URL was not returned.')}catch(e){msg.textContent=e.message;btn.disabled=false}};load();
</script></body></html>
