<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language & Preferences</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:34px 20px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:13px;padding:24px}.row{display:grid;gap:8px;margin:18px 0}select{font:inherit;padding:11px;border:1px solid #d7dce2;border-radius:8px;background:#fff}.btn{border:1px solid #d7dce2;border-radius:8px;padding:10px 14px;background:#11151a;color:#fff;cursor:pointer}.muted{color:#69717d}#status{min-height:20px}</style></head><body><main class="wrap"><p><a href="/storefront/dashboard.html">← My Account</a></p><section class="panel"><h1>Language & Preferences</h1><p class="muted">English is the default marketplace language. Your selected locale is stored locally and used when requesting localized catalog content.</p><div class="row"><label for="locale"><strong>Preferred language</strong></label><select id="locale"><option value="en">English</option><option value="ja">日本語</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt-BR">Português (Brasil)</option></select></div><button id="save" class="btn">Save preference</button><p id="status" class="muted" role="status"></p></section></main><script>const key='marketplace.locale',select=document.getElementById('locale'),status=document.getElementById('status');select.value=localStorage.getItem(key)||((navigator.language||'en').toLowerCase().startsWith('ja')?'ja':(navigator.language||'en').split('-')[0]);document.getElementById('save').onclick=()=>{localStorage.setItem(key,select.value);document.documentElement.lang=select.value;status.textContent='Language preference saved.'};</script></body></html>
