<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Marketplace — Browse</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.tools{display:flex;gap:10px;align-items:center}.controls{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin:24px 0}input,select,button{font:inherit;padding:11px;border:1px solid #d7dce2;border-radius:8px;background:#fff}.btn{cursor:pointer;text-decoration:none;color:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:18px;display:flex;flex-direction:column;min-height:230px}.badge{font-size:12px;color:#69717d}.title{font-size:19px;font-weight:800;margin:8px 0}.desc{color:#59616c;line-height:1.5;flex:1}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.price{font-weight:800}.pager{display:flex;justify-content:center;gap:10px;margin:25px}.empty{text-align:center;padding:50px;color:#69717d}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1 data-i18n="discoverVideos">Discover videos</h1><p class="badge" data-i18n="discoverSubtitle">Search, compare and choose your next video.</p></div><div class="tools"><label for="language" data-i18n="language">Language</label><select id="language" aria-label="Language"></select><a href="/" class="btn" data-i18n="home">Home</a></div></div><form id="filters" class="controls"><input id="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search videos or sellers"><input id="category" data-i18n-placeholder="categoryPlaceholder" placeholder="Category"><button class="btn" data-i18n="search">Search</button></form><section id="grid" class="grid"></section><div class="pager"><button id="prev" data-i18n="previous">Previous</button><span id="page">1</span><button id="next" data-i18n="next">Next</button></div></main><script type="module">
import {SUPPORTED_LOCALES,getLocale,setLocale,t} from '/shared/i18n.js';
const $=id=>document.getElementById(id);let current=1;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalogMessages={en:{discoverVideos:'Discover videos',discoverSubtitle:'Search, compare and choose your next video.',language:'Language',home:'Home',searchPlaceholder:'Search videos or sellers',categoryPlaceholder:'Category',search:'Search',previous:'Previous',next:'Next',view:'View',noVideos:'No videos found.',loadError:'Unable to load catalog.'},ja:{discoverVideos:'動画を探す',discoverSubtitle:'動画を検索・比較して、気になる作品を選べます。',language:'言語',home:'ホーム',searchPlaceholder:'動画や販売者を検索',categoryPlaceholder:'カテゴリー',search:'検索',previous:'前へ',next:'次へ',view:'詳細を見る',noVideos:'動画が見つかりません。',loadError:'カタログを読み込めませんでした。'}};
function uiLocale(){return getLocale()}function tr(key){const l=uiLocale();return catalogMessages[l]?.[key]??catalogMessages.en[key]??t(key,l)}
function renderI18n(){document.documentElement.lang=uiLocale();document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=tr(e.dataset.i18nPlaceholder));const s=$('language');s.replaceChildren(...SUPPORTED_LOCALES.map(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;o.selected=l===uiLocale();return o}))}
async function load(){renderI18n();const p=new URLSearchParams({locale:uiLocale(),search:$('search').value.trim(),category:$('category').value.trim(),page:current,limit:12});try{const r=await fetch('/api/catalog/products?'+p);const d=await r.json();if(!r.ok)throw Error();const items=d.data||[];$('grid').innerHTML=items.length?items.map(x=>`<article class="card"><span class="badge">${esc(x.category||'Uncategorized')} · ${esc(x.seller||'')}</span><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><div class="bottom"><span class="price">${esc(x.price_currency)} ${esc(x.price_amount)}</span><a class="btn" href="/storefront/product.html?id=${encodeURIComponent(x.id)}">${esc(tr('view'))}</a></div></article>`).join(''):`<div class="empty">${esc(tr('noVideos'))}</div>`;$('page').textContent=current;$('prev').disabled=current<=1;$('next').disabled=!d.pagination?.hasMore}catch{$('grid').innerHTML=`<div class="empty">${esc(tr('loadError'))}</div>`}}
$('language').onchange=e=>{setLocale(e.target.value);load()};$('filters').onsubmit=e=>{e.preventDefault();current=1;load()};$('prev').onclick=()=>{if(current>1){current--;load()}};$('next').onclick=()=>{current++;load()};load();
</script></body></html>
