<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Marketplace — Browse</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.controls{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin:24px 0}input,select,button{font:inherit;padding:11px;border:1px solid #d7dce2;border-radius:8px;background:#fff}.btn{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:18px;display:flex;flex-direction:column;min-height:230px}.badge{font-size:12px;color:#69717d}.title{font-size:19px;font-weight:800;margin:8px 0}.desc{color:#59616c;line-height:1.5;flex:1}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.price{font-weight:800}.pager{display:flex;justify-content:center;gap:10px;margin:25px}.empty{text-align:center;padding:50px;color:#69717d}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Discover videos</h1><p class="badge">Search, compare and choose your next video.</p></div><a href="/" class="btn">Home</a></div><form id="filters" class="controls"><input id="search" placeholder="Search videos or sellers"><input id="category" placeholder="Category"><button class="btn">Search</button></form><section id="grid" class="grid"></section><div class="pager"><button id="prev">Previous</button><span id="page">1</span><button id="next">Next</button></div></main><script>
let current=1;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function locale(){return localStorage.getItem('marketplace.locale')||navigator.language||'en'}
async function load(){const p=new URLSearchParams({locale:locale(),search:$('search').value.trim(),category:$('category').value.trim(),page:current,limit:12});const r=await fetch('/api/catalog/products?'+p);const d=await r.json();if(!r.ok){$('grid').innerHTML='<div class="empty">Unable to load catalog.</div>';return}const items=d.data||[];$('grid').innerHTML=items.length?items.map(x=>`<article class="card"><span class="badge">${esc(x.category||'Uncategorized')} · ${esc(x.seller||'')}</span><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><div class="bottom"><span class="price">${esc(x.price_currency)} ${esc(x.price_amount)}</span><a class="btn" href="/storefront/product.html?id=${encodeURIComponent(x.id)}">View</a></div></article>`).join(''):'<div class="empty">No videos found.</div>';$('page').textContent=current;$('prev').disabled=current<=1;$('next').disabled=!d.pagination?.hasMore}
$('filters').onsubmit=e=>{e.preventDefault();current=1;load()};$('prev').onclick=()=>{if(current>1){current--;load()}};$('next').onclick=()=>{current++;load()};load();
</script></body></html>
