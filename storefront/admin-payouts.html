<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Payout Review</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212f}main{max-width:1100px;margin:auto;padding:24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1.2fr .8fr .7fr .8fr 1.5fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f3}.row:last-child{border-bottom:0}button,select{padding:9px 12px;border:1px solid #cbd3dc;border-radius:8px;background:#fff}button{cursor:pointer}.danger{color:#a12626}.muted{color:#687586;font-size:.9rem}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:.82rem}.message{margin-top:12px;min-height:20px}@media(max-width:760px){.row{grid-template-columns:1fr}.row button,.row select{width:100%}}</style></head><body><main><h1>出金申請の管理</h1><p class="muted">Sellerから申請された出金を確認し、決められたステータス遷移に沿って処理します。</p><div class="toolbar"><label>表示 <select id="filter"><option value="all">すべて</option><option value="requested">申請中</option><option value="reviewing">審査中</option><option value="approved">承認済み</option><option value="processing">処理中</option><option value="paid">支払済み</option><option value="failed">失敗</option><option value="cancelled">キャンセル</option></select></label><button id="reload">再読み込み</button></div><div id="message" class="message"></div><section class="card"><div id="list">読み込み中…</div></section></main><script type="module" src="/admin-payouts.js"></script></body></html>
