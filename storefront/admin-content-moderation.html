<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Content Moderation</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212f}main{max-width:1200px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:9px 12px;border:1px solid #cbd3dc;background:#fff;border-radius:8px}.tabs button.active{font-weight:700}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin:14px 0}.item{padding:16px 0;border-bottom:1px solid #edf0f3}.item:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#687586;font-size:.9rem}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:.82rem}button,select,textarea{padding:9px 12px;border:1px solid #cbd3dc;border-radius:8px;background:#fff}button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}textarea{width:100%;min-height:70px;box-sizing:border-box;margin-top:8px}.danger{color:#a12626}@media(max-width:700px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>コンテンツ審査・通報管理</h1><p class="muted">公開コンテンツの審査、利用者からの通報、緊急停止（Takedown）を管理します。</p><div class="tabs"><button data-tab="reviews" class="active">審査</button><button data-tab="reports">通報</button></div><div class="card"><label>ステータス <select id="status"><option value="">すべて</option><option value="pending">審査待ち</option><option value="approved">承認</option><option value="changes_requested">修正依頼</option><option value="rejected">却下</option><option value="blocked">停止</option></select></label><div id="message" class="muted"></div></div><section class="card"><div id="list">読み込み中…</div></section></main><script type="module" src="/admin-content-moderation.js"></script></body></html>
