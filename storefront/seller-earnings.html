<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Earnings</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:20px;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;border:1px solid #e1e5e9;border-radius:10px}.stat strong{display:block;font-size:22px;margin-top:8px}.form{display:grid;grid-template-columns:1fr 140px auto;gap:10px;align-items:end}.form label{display:grid;gap:6px;font-weight:650}input,button{font:inherit;border:1px solid #d7dce2;border-radius:8px;padding:10px;background:#fff}.primary{background:#171a1f;color:#fff;border-color:#171a1f;cursor:pointer}.muted{color:#69717d}.error{color:#a11}.success{color:#176b3a}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f2}.badge{font-size:12px;color:#69717d}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><h1>Seller Earnings</h1><p class="muted">View earnings, available balance and payout requests.</p></div><div class="actions"><a href="/storefront/seller.html">Seller Dashboard</a></div></header><p id="earningsStatus" class="muted"></p><section class="panel stats"><div class="stat"><span id="earnedLabel">Total earned</span><strong id="earnedValue">—</strong></div><div class="stat"><span id="availableLabel">Available to withdraw</span><strong id="availableValue">—</strong></div><div class="stat"><span id="paidLabel">Paid out</span><strong id="paidValue">—</strong></div><div class="stat"><span id="refundedLabel">Refunded</span><strong id="refundedValue">—</strong></div><div class="stat"><span id="salesLabel">Sales</span><strong id="salesValue">—</strong></div></section><section class="panel"><h2 id="requestTitle">Request payout</h2><form id="payoutForm" class="form"><label><span id="amountLabel">Amount</span><input id="payoutAmount" type="number" min="0.01" step="0.01" required></label><label><span id="currencyLabel2">Currency</span><input id="payoutCurrency" value="JPY" maxlength="3" required></label><button class="primary" id="submitPayout" type="submit">Submit payout request</button></form><p id="payoutMessage" class="muted"></p></section><section class="panel"><h2 id="historyTitle">Payout history</h2><div id="payoutHistory"></div></section></main><script type="module">import{initSellerEarnings}from'./seller-earnings.js';initSellerEarnings()</script></body></html>
