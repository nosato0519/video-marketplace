<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:8px;align-items:center}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;margin-top:20px;overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;padding:15px;border-bottom:1px solid #edf0f2;gap:12px;align-items:center}.head{font-size:12px;color:#69717d;font-weight:700}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;border-radius:8px;padding:9px 12px;text-decoration:none;color:#171a1f;background:#fff}.empty{padding:50px;text-align:center}select{border:1px solid #d7dce2;border-radius:8px;padding:9px 10px;background:#fff}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.row{min-width:650px}}
</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">Order History</h1><p class="muted" id="description">Review your marketplace purchases and payment status.</p></div><div class="actions"><div id="languageSwitcher"></div><a class="btn" id="libraryLink" href="/storefront/library.html">My Library</a><a class="btn" id="browseLink" href="/storefront/catalog.html">Browse</a></div></div><section class="panel"><div class="row head"><div id="productHead">Product</div><div id="statusHead">Status</div><div id="amountHead">Amount</div><div id="dateHead">Order date</div></div><div id="rows"><div class="empty" id="loading">Loading…</div></div></section></main><script type="module">import {getLocale,t,installLanguageSwitcher} from '/shared/i18n.js';const locale=getLocale();const rows=document.getElementById('rows'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderText(){document.documentElement.lang=locale;document.title=t('orderHistory',locale);for(const [id,key] of [['title','orderHistory'],['description','orderHistoryDescription'],['productHead','product'],['statusHead','status'],['amountHead','amount'],['dateHead','orderDate'],['libraryLink','myLibrary'],['loading','loading']]){const el=document.getElementById(id);if(el)el.textContent=t(key,locale)}document.getElementById('browseLink').textContent=locale==='ja'?'商品を見る':'Browse';installLanguageSwitcher({containerId:'languageSwitcher'})}async function load(){renderText();const r=await fetch('/api/orders',{credentials:'same-origin',headers:{'Accept-Language':locale}});if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}let d={};try{d=await r.json()}catch{}if(!r.ok){rows.innerHTML='<div class="empty">'+esc(t('unableToLoadOrders',locale))+'</div>';return}rows.innerHTML=d.items?.length?d.items.map(x=>`<div class="row"><div><strong>${esc(x.title)}</strong><br><span class="muted">${esc(x.id)}</span></div><div>${esc(x.status)}</div><div>${esc(x.currency)} ${esc(x.total_amount)}</div><div>${esc(x.created_at)}</div></div>`).join(''):'<div class="empty">'+esc(t('noOrders',locale))+'</div>'}load();</script></body></html>
