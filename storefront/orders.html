<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;margin-top:20px;overflow:auto}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;padding:15px;border-bottom:1px solid #edf0f2;gap:12px;align-items:center}.head{font-size:12px;color:#69717d;font-weight:700}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;border-radius:8px;padding:9px 12px;text-decoration:none;color:#171a1f;background:#fff}.empty{padding:50px;text-align:center}@media(max-width:700px){.row{min-width:650px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Order History</h1><p class="muted">Review your marketplace purchases and payment status.</p></div><div><a class="btn" href="/storefront/library.html">My Library</a><a class="btn" href="/storefront/catalog.html">Browse</a></div></div><section class="panel"><div class="row head"><div>Product</div><div>Status</div><div>Amount</div><div>Order date</div></div><div id="rows"><div class="empty">Loading…</div></div></section></main><script>const rows=document.getElementById('rows'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/orders',{credentials:'same-origin'});if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}const d=await r.json();if(!r.ok){rows.innerHTML='<div class="empty">Unable to load orders.</div>';return}rows.innerHTML=d.items?.length?d.items.map(x=>`<div class="row"><div><strong>${esc(x.title)}</strong><br><span class="muted">${esc(x.id)}</span></div><div>${esc(x.status)}</div><div>${esc(x.currency)} ${esc(x.total_amount)}</div><div>${esc(x.created_at)}</div></div>`).join(''):'<div class="empty">No orders yet.</div>'}load();</script></body></html>
