<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.heading{flex:1}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:18px}.title{font-weight:800;font-size:19px}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;border-radius:8px;padding:9px 12px;text-decoration:none;color:#171a1f;background:#fff;margin-top:15px}.empty{text-align:center;padding:50px}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{margin-top:20px;padding:12px;border-radius:8px;background:#f0f2f4;font-size:13px}select{border:1px solid #d7dce2;border-radius:8px;padding:9px 30px 9px 10px;background:#fff}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.tools{width:100%}}</style></head><body><main class="wrap"><div class="top"><div class="heading"><h1 id="pageTitle">My Library</h1><p id="subtitle" class="muted">Your purchased videos.</p></div><div class="tools"><div id="languageSwitcher"></div><a id="browse" class="btn" href="/storefront/catalog.html">Browse more</a></div></div><div id="notice" class="notice">Downloads are authorized by your account on the server. Private media URLs and storage credentials are never exposed here.</div><section id="grid" class="grid"><div class="empty" id="loading">Loading…</div></section></main><script type="module">
import {getLocale,installLanguageSwitcher,t} from '../shared/i18n.js';
const grid=document.getElementById('grid'),locale=getLocale();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.documentElement.lang=locale;document.title=t('myLibrary',locale);document.getElementById('pageTitle').textContent=t('myLibrary',locale);document.getElementById('subtitle').textContent=t('purchasedVideos',locale);document.getElementById('browse').textContent=locale==='ja'?'カタログを見る':'Browse more';document.getElementById('notice').textContent=locale==='ja'?'ダウンロードはサーバー側でアカウントと購入権限を確認します。非公開の動画URLやストレージ情報は表示されません。':'Downloads are authorized by your account on the server. Private media URLs and storage credentials are never exposed here.';
installLanguageSwitcher();
async function load(){try{const r=await fetch(`/api/library?locale=${encodeURIComponent(locale)}`,{credentials:'same-origin',headers:{Accept:'application/json'}});if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}const d=await r.json().catch(()=>({}));if(!r.ok){grid.innerHTML=`<div class="empty">${esc(d.message||'Unable to load your library.')}</div>`;return}grid.innerHTML=d.items?.length?d.items.map(x=>`<article class="card"><div class="title">${esc(x.title)}</div><p class="muted">${esc(locale==='ja'?'購入日':'Purchased')} ${esc(x.purchased_at)}</p><p>${esc(x.description||'')}</p><div class="actions">${x.streaming_enabled?`<a class="btn" href="/player.html?productId=${encodeURIComponent(x.product_id)}">${esc(t('watch',locale))}</a>`:''}${x.download_enabled?`<a class="btn" href="/api/media/${encodeURIComponent(x.product_id)}/download">${esc(t('download',locale))}</a>`:''}</div></article>`).join(''):`<div class="empty">${esc(t('noPurchases',locale))}</div>`}catch(error){grid.innerHTML='<div class="empty">Unable to load your library.</div>';console.error(error)}}load();
</script></body></html>
