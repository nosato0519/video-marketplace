<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:18px}.title{font-weight:800;font-size:19px}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;border-radius:8px;padding:9px 12px;text-decoration:none;color:#171a1f;background:#fff;margin-top:15px}.empty{text-align:center;padding:50px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:12px}}</style></head><body><main class="wrap"><div class="top"><div><h1>My Library</h1><p class="muted">Your purchased videos and authorized delivery options.</p></div><a class="btn" href="/storefront/catalog.html">Browse more</a></div><section id="grid" class="grid"><div class="empty">Loading…</div></section></main><script>
const grid=document.getElementById('grid'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/library',{credentials:'same-origin'});if(r.status===401){location.href='/login.html?returnTo='+encodeURIComponent(location.href);return}const d=await r.json();if(!r.ok){grid.innerHTML='<div class="empty">Unable to load your library.</div>';return}grid.innerHTML=d.items?.length?d.items.map(x=>`<article class="card"><div class="title">${esc(x.title)}</div><p class="muted">Purchased ${esc(x.purchased_at)}</p><p>${esc(x.description||'')}</p><div class="actions">${x.streaming_enabled?`<a class="btn" href="/player.html?productId=${encodeURIComponent(x.product_id)}">Watch</a>`:''}${x.download_enabled?`<a class="btn" href="/api/media/download?productId=${encodeURIComponent(x.product_id)}">Download</a>`:''}</div></article>`).join(''):'<div class="empty">You have no purchased videos yet.</div>'}load();
</script></body></html>
