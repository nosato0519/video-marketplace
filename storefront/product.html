<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:14px;padding:24px;margin-bottom:18px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:26px}.eyebrow{font-size:13px;color:#69717d}.title{font-size:32px;line-height:1.2;margin:8px 0 15px}.desc{line-height:1.7;color:#505864;white-space:pre-wrap}.price{font-size:28px;font-weight:800}.meta{display:grid;gap:12px;margin:20px 0}.meta div{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f2;padding:10px 0}.btn{display:inline-block;padding:12px 16px;border-radius:9px;border:1px solid #d7dce2;background:#fff;text-decoration:none;color:#171a1f;cursor:pointer}.buy{width:100%;background:#11151a;color:#fff;border-color:#11151a;font-weight:700}.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.trust div{border:1px solid #e4e7ea;border-radius:9px;padding:15px}.muted{color:#69717d}.error{color:#a22}.top{margin-bottom:18px}@media(max-width:750px){.hero,.trust{grid-template-columns:1fr}.title{font-size:26px}}</style></head><body><main class="wrap"><div class="top"><a class="btn" href="/storefront/catalog.html">← Browse</a></div><div id="app">Loading…</div></main><script>
const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function locale(){return localStorage.getItem('marketplace.locale')||navigator.language||'en'}async function load(){if(!id){app.innerHTML='<p class="error">Product not found.</p>';return}try{const r=await fetch('/api/catalog/products/'+encodeURIComponent(id)+'?locale='+encodeURIComponent(locale()));const p=await r.json();if(!r.ok)throw Error(p.error?.code||'Unable to load product');app.innerHTML=`<section class="panel hero"><div><div class="eyebrow">${esc(p.category||'Video')} · ${esc(p.seller||'')}</div><h1 class="title">${esc(p.title)}</h1><div class="desc">${esc(p.description)}</div></div><aside><div class="price">${esc(p.price_currency)} ${esc(p.price_amount)}</div><div class="meta"><div><span>Streaming</span><strong>${p.streaming_enabled?'Available':'No'}</strong></div><div><span>Download</span><strong>${p.download_enabled?'Available':'No'}</strong></div><div><span>Seller</span><strong>${esc(p.seller||'')}</strong></div></div><button id="buy" class="btn buy">Buy now</button><p id="msg" class="muted"></p></aside></section><section class="panel"><h2>Purchase with confidence</h2><div class="trust"><div><strong>Secure checkout</strong><br><span class="muted">Payment is handled by the marketplace checkout.</span></div><div><strong>Your access</strong><br><span class="muted">Purchased content is tied to your account.</span></div><div><strong>Delivery</strong><br><span class="muted">Access streaming and downloads from your library when enabled.</span></div></div></section>`;document.getElementById('buy').onclick=()=>location.href='/storefront/checkout.html?productId='+encodeURIComponent(id)}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}load();
</script></body></html>
