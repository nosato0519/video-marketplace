<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Seller Verification</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18212f}main{max-width:1100px;margin:auto;padding:24px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin:14px 0}.seller{padding:16px 0;border-bottom:1px solid #edf0f3}.seller:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.muted{color:#687586;font-size:.9rem}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:.82rem}button,select,textarea{padding:9px 12px;border:1px solid #cbd3dc;border-radius:8px;background:#fff}textarea{width:100%;box-sizing:border-box;min-height:70px;margin-top:8px}.danger{color:#a12626}.success{color:#166534}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Seller本人確認・審査</h1><p class="muted">申請内容を確認し、承認・却下・追加対応依頼を行います。判断内容は監査履歴に残ります。</p><div class="toolbar"><select id="status"><option value="submitted">申請中</option><option value="under_review">審査中</option><option value="request_changes">要修正</option><option value="rejected">却下</option><option value="verified">承認済み</option></select><button id="reload">再読み込み</button></div><p id="message"></p><section class="card"><div id="list">読み込み中…</div></section></main><script type="module" src="/admin-sellers.js"></script></body></html>
