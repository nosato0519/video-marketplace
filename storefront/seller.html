<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.actions{display:flex;gap:8px;align-items:center}select,input,textarea,button{font:inherit;border:1px solid #d7dce2;border-radius:8px;padding:10px;background:#fff}.btn{cursor:pointer}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f2}.muted{color:#69717d}.badge{font-size:12px;color:#69717d}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-weight:650}.form textarea{min-height:100px;resize:vertical}.btn.primary{background:#171a1f;color:#fff;border-color:#171a1f}.notice{padding:12px;border-radius:8px;background:#f2f4f6}.error{color:#a11}.success{color:#176b3a}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><h1 id="title">Seller Dashboard</h1><p class="muted" id="subtitle">Manage your products and publish videos.</p></div><div class="actions"><label><span id="langLabel">Language</span> <select id="language"><option value="en">en</option><option value="ja">ja</option></select></label><a class="btn" href="/storefront/catalog.html">Catalog</a></div></header><div class="grid"><section class="panel"><h2 id="productsTitle">My Products</h2><div id="status" class="notice">Loading…</div><div id="products"></div></section><section class="panel"><h2 id="newTitle">Create Product</h2><form id="productForm" class="form"><label><span id="titleLabel">Title</span><input id="productTitle" required maxlength="200"></label><label><span id="descLabel">Description</span><textarea id="description" maxlength="5000"></textarea></label><label><span id="priceLabel">Price</span><input id="price" type="number" min="0" step="0.01" required></label><label><span id="currencyLabel">Currency</span><input id="currency" value="JPY" maxlength="3" required></label><label><span id="downloadLabel">Allow download</span><select id="download"><option value="true">Yes</option><option value="false">No</option></select></label><button class="btn primary" type="submit" id="createButton">Create Draft</button></form><p id="formMessage" class="muted"></p></section></div></main><script type="module">import{getLocale,setLocale}from'/shared/i18n.js';const $=id=>document.getElementById(id);const copy={en:{title:'Seller Dashboard',subtitle:'Manage your products and publish videos.',productsTitle:'My Products',newTitle:'Create Product',titleLabel:'Title',descLabel:'Description',priceLabel:'Price',currencyLabel:'Currency',downloadLabel:'Allow download',createButton:'Create Draft',loading:'Loading…',empty:'No products yet.',loadError:'Unable to load products.',created:'Draft created.',unauthorized:'Seller login is required.'},ja:{title:'販売者ダッシュボード',subtitle:'商品を管理して動画を公開できます。',productsTitle:'自分の商品',newTitle:'商品を作成',titleLabel:'タイトル',descLabel:'説明',priceLabel:'価格',currencyLabel:'通貨',downloadLabel:'ダウンロードを許可',createButton:'下書きを作成',loading:'読み込み中…',empty:'商品はまだありません。',loadError:'商品を読み込めませんでした。',created:'下書きを作成しました。',unauthorized:'販売者としてのログインが必要です。'}};function tr(k){return copy[getLocale()]?.[k]??copy.en[k]??k}function render(){document.documentElement.lang=getLocale();for(const[id,key]of Object.entries({title:'title',subtitle:'subtitle',productsTitle:'productsTitle',newTitle:'newTitle',titleLabel:'titleLabel',descLabel:'descLabel',priceLabel:'priceLabel',currencyLabel:'currencyLabel',downloadLabel:'downloadLabel',createButton:'createButton'}))$(id).textContent=tr(key)}async function load(){render();$('status').textContent=tr('loading');const r=await fetch('/api/seller/products',{credentials:'same-origin',headers:{'Accept-Language':getLocale()}});if(r.status===401||r.status===403){$('status').textContent=tr('unauthorized');return}let d={};try{d=await r.json()}catch{}if(!r.ok){$('status').textContent=tr('loadError');return}const items=d.data||d.items||[];$('status').textContent='';$('products').innerHTML=items.length?items.map(x=>`<div class="row"><div><strong>${esc(x.title||x.name||x.id)}</strong><div class="badge">${esc(x.status||'draft')} · ${esc(x.price_currency||x.currency||'')} ${esc(x.price_amount??x.price??'')}</div></div><span class="badge">${esc(x.id)}</span></div>`).join(''):`<div class="muted">${tr('empty')}</div>`}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('language').value=getLocale()==='ja'?'ja':'en';$('language').onchange=e=>{setLocale(e.target.value);render();load()};$('productForm').onsubmit=async e=>{e.preventDefault();$('formMessage').textContent=tr('loading');const body={title:$('productTitle').value.trim(),description:$('description').value.trim(),price_amount:Number($('price').value),price_currency:$('currency').value.trim().toUpperCase(),download_enabled:$('download').value==='true'};const r=await fetch('/api/seller/products',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept-Language':getLocale()},body:JSON.stringify(body)});if(r.ok){$('formMessage').className='success';$('formMessage').textContent=tr('created');e.target.reset();$('currency').value='JPY';load()}else{$('formMessage').className='error';$('formMessage').textContent=tr('loadError')}};load();</script></body></html>
