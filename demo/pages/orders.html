<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order History | VIDEO MARKETPLACE</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f4f1eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.top{height:76px;border-bottom:1px solid #29282a;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.logo{font-size:13px;font-weight:800;letter-spacing:.18em}.back{font-size:11px;color:#aaa6a0}.wrap{max-width:1050px;margin:auto;padding:55px 24px 90px}.eyebrow{font-size:10px;letter-spacing:.28em;color:#c6a864;font-weight:800}.title{font-size:50px;letter-spacing:-.045em;margin:12px 0}.lead{color:#99958f;font-size:12px;line-height:1.9}.order{margin-top:32px;border:1px solid #35333a;background:linear-gradient(145deg,#17181c,#0d0e11)}.order-head{display:flex;justify-content:space-between;gap:20px;padding:20px 24px;border-bottom:1px solid #302f34;font-size:10px;color:#aaa6a0}.status{color:#d9b45f}.line{display:grid;grid-template-columns:1fr auto;padding:24px;gap:20px}.name{font-size:17px}.meta{font-size:10px;color:#99958f;margin-top:7px}.price{font-size:18px}.foot{display:flex;justify-content:space-between;padding:17px 24px;font-size:10px;border-top:1px solid #29282d}.foot a{color:#d9b45f}.empty{margin-top:18px;padding:18px;border:1px solid #343238;color:#88847e;font-size:10px}@media(max-width:600px){.title{font-size:40px}.line{grid-template-columns:1fr}.price{font-size:16px}.order-head,.foot{display:block}.foot span,.foot a{display:block;margin-top:7px}}
</style></head><body><header class="top"><a class="logo" href="/">VIDEO MARKETPLACE</a><a class="back" href="/">← TOP</a></header><main class="wrap"><div class="eyebrow">ACCOUNT / ORDERS</div><h1 class="title">購入履歴。</h1><p class="lead">これまでに購入した動画と、購入日時・金額・利用状態を確認できます。</p><div id="ordersList"><article class="order"><div class="order-head"><span>購入履歴を読み込み中…</span><span class="status">—</span></div></article></div><div class="empty" id="ordersEmpty" style="display:none">まだ購入履歴はありません。</div></main><script>
(async()=>{
 try{
  if(localStorage.getItem('vm_auth_role')!=='buyer'){location.replace('/pages/register.html?returnTo='+encodeURIComponent(location.href));return;}
  const r=await fetch('/api/demo/state',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;
  const d=await r.json();const orders=Array.isArray(d.orders)?d.orders:[];const all=[...(Array.isArray(d.products)?d.products:[]),...(Array.isArray(d.sellerProducts)?d.sellerProducts:[])];
  const list=document.getElementById('ordersList'),empty=document.getElementById('ordersEmpty');if(!list)return;
  if(!orders.length){list.innerHTML='';if(empty)empty.style.display='block';return;}
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  list.innerHTML=orders.slice().reverse().map(o=>{const p=all.find(x=>String(x.id)===String(o.productId))||{};return '<article class="order"><div class="order-head"><span>ORDER #'+esc(o.id)+'</span><span class="status">COMPLETED</span></div><div class="line"><div><div class="name">'+esc(p.title||'購入動画')+'</div><div class="meta">'+esc(p.seller||'Demo Creator')+'　•　'+esc(p.category||'VIDEO')+'　•　購入日 '+new Date(o.createdAt||Date.now()).toLocaleDateString('ja-JP')+'</div></div><div class="price">¥'+Number(o.total||p.price||0).toLocaleString()+'</div></div><div class="foot"><span>支払い方法　デモカード</span><a href="/pages/watch.html?product='+encodeURIComponent(String(o.productId))+'">購入済み動画を視聴 →</a></div></article>';}).join('');
 }catch(e){}
})();
</script></body></html>
