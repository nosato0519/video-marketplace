<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | VIDEO MARKETPLACE</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f4f1eb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.top{height:76px;border-bottom:1px solid #29282a;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.logo{font-size:13px;font-weight:800;letter-spacing:.18em}.back{font-size:11px;color:#aaa6a0}.wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:60px 20px}.card{width:min(500px,100%);padding:42px;border:1px solid #3a383d;background:linear-gradient(145deg,#17181c,#0d0e11);box-shadow:0 30px 80px #0008}.eyebrow{font-size:10px;letter-spacing:.28em;color:#c6a864;font-weight:800}.title{font-size:42px;letter-spacing:-.04em;margin:13px 0 10px}.lead{color:#99958f;font-size:12px;line-height:1.8;margin:0 0 28px}.field{margin:16px 0}.field label{display:block;font-size:10px;color:#aaa6a0;margin-bottom:8px}.field input{width:100%;padding:14px;background:#0a0b0d;border:1px solid #39373c;color:#f4f1eb;outline:none}.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.role label{padding:13px;border:1px solid #39373c;text-align:center;font-size:10px;color:#aaa6a0;cursor:pointer}.role input{display:none}.role input:checked+span{color:#d9b45f}.btn{width:100%;padding:15px;border:1px solid #c6a864;background:#c6a864;color:#0b0c0e;font-weight:800;letter-spacing:.08em;cursor:pointer}.foot{margin-top:20px;text-align:center;font-size:10px;color:#aaa6a0}.foot a{color:#d9b45f}.demo{margin-top:22px;padding:13px;border:1px solid #343238;color:#88847e;font-size:9px;line-height:1.7}@media(max-width:600px){.card{padding:28px}.title{font-size:36px}.role{grid-template-columns:1fr}}
</style></head><body><header class="top"><a class="logo" href="/">VIDEO MARKETPLACE</a><a class="back" href="/">← TOP</a></header><main class="wrap"><section class="card"><div class="eyebrow">ACCOUNT / REGISTER</div><h1 class="title">はじめる。</h1><p class="lead">購入者として動画を楽しむか、販売者として作品を届けるか。利用目的に合わせてアカウントを作成できます。</p><div class="field"><label>NAME</label><input placeholder="お名前"></div><div class="field"><label>EMAIL ADDRESS</label><input type="email" placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input type="password" placeholder="8文字以上"></div><div class="role"><label><input type="radio" name="role" checked><span>購入者として登録</span></label><label><input type="radio" name="role"><span>販売者として登録</span></label></div><button class="btn" type="button" onclick="event.preventDefault();event.stopPropagation();window.location.href='/pages/account.html'">アカウントを作成 →</button><div class="foot">すでにアカウントをお持ちですか？ <a href="/pages/login.html">ログイン</a></div><div class="demo">DEMO ONLY — 入力情報は送信・保存されません。実運用時はメール認証・利用規約同意などを組み込みます。</div></section></main></body></html>
