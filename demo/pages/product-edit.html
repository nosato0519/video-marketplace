<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品を編集 | VIDEO MARKETPLACE</title>
<style>
:root{--bg:#08090b;--panel:#111216;--line:#35333a;--text:#f4f1eb;--muted:#99958f;--gold:#d9b45f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(217,180,95,.1),transparent 32%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1120px;margin:auto;padding:0 26px 90px}.top{height:78px;border-bottom:1px solid #29282a;display:flex;align-items:center;justify-content:space-between}.logo{font-size:13px;font-weight:800;letter-spacing:.18em}.back{font-size:10px;color:var(--muted);text-decoration:none}.head{padding:48px 0 30px}.eyebrow{font-size:9px;letter-spacing:.25em;color:#c6a864;font-weight:800}.head h1{font-size:42px;letter-spacing:-.04em;margin:12px 0 8px}.head p{color:var(--muted);font-size:11px;line-height:1.8;margin:0}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#15161a,#0d0e11);padding:28px}.form{display:grid;gap:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#aaa6a0;font-size:9px;letter-spacing:.08em;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #3a383f;background:#0a0b0d;color:var(--text);padding:13px;font:inherit;font-size:11px;outline:none}.field textarea{min-height:150px;resize:vertical;line-height:1.8}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.upload{border:1px solid #302f34;background:#0c0d0f;padding:16px}.upload strong{font-size:10px}.upload p{color:#77736e;font-size:9px;margin:6px 0 10px;line-height:1.6}.upload input{width:100%;color:#aaa6a0;font-size:9px}.preview{display:none;max-width:360px;width:100%;aspect-ratio:16/9;object-fit:cover;margin-top:10px;border:1px solid #302f34}.actions{display:flex;gap:10px;margin-top:4px}.btn{display:inline-block;border:1px solid #4a474d;background:#111216;color:#eee;padding:13px 18px;font-size:10px;font-weight:800;letter-spacing:.07em;text-decoration:none;cursor:pointer}.btn.primary{border-color:var(--gold);background:var(--gold);color:#101114}.notice{display:none;margin-top:18px;padding:14px;border:1px solid #5b4b2d;background:#12110e;color:#d9b45f;font-size:10px;line-height:1.7}.notice.show{display:block}.meta{margin-top:12px;color:#77736e;font-size:9px;line-height:1.8}.success-actions{display:none;margin-top:12px;gap:10px}.success-actions.show{display:flex}@media(max-width:700px){.wrap{padding:0 18px 70px}.row{grid-template-columns:1fr}.actions,.success-actions{display:grid}.btn{text-align:center}.head h1{font-size:34px}}
</style>
</head>
<body><div class="wrap"><header class="top"><a class="logo" href="/">VIDEO MARKETPLACE</a><a class="back" id="backLink" href="/pages/creator-studio.html#products">← 商品管理へ戻る</a></header>
<section class="head"><div class="eyebrow">SELLER / PRODUCT MANAGEMENT</div><h1>商品を編集する。</h1><p>アップロード済みの動画を、同じ商品IDのまま修正できます。保存後も審査状態は維持されます。</p></section>
<section class="panel"><form class="form" id="editForm"><div class="field"><label>商品タイトル</label><input id="title" required></div><div class="row"><div class="field"><label>カテゴリー</label><select id="category"><option>Education</option><option>Film</option><option>Business</option><option>Creative</option><option>Adult</option><option>LEARNING</option><option>LIFESTYLE</option></select></div><div class="field"><label>販売価格</label><input id="price" type="number" min="1" required></div></div><div class="field"><label>商品説明</label><textarea id="description"></textarea></div><div class="upload"><strong>サムネイル画像</strong><p>現在のサムネイルを表示。新しい画像を選ぶと差し替えます。</p><input id="thumbnail" type="file" accept="image/jpeg,image/png,image/webp"><img id="thumbnailPreview" class="preview" alt="サムネイルプレビュー"></div><div class="upload"><strong>動画ファイル</strong><p>現在の動画ファイル名を確認し、新しい動画に差し替えられます。</p><input id="video" type="file" accept="video/*"><div id="videoPreviewWrap"></div><div id="videoName" class="meta"></div></div><div class="upload"><strong>紹介画像・ギャラリー（4枚）</strong><p>現在の4枚を表示。各画像を個別に差し替えできます。</p><div id="galleryEditGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px"></div><div id="galleryName" class="meta"></div></div><div class="actions"><button class="btn primary" type="submit">変更を保存する</button><a class="btn" id="publicLink" href="/pages/product-detail.html">公開ページを見る →</a></div><div id="notice" class="notice"></div><div id="successActions" class="success-actions"><a class="btn" href="/pages/creator-studio.html#products">商品管理へ戻る →</a></div></form></section></div>
<script>
const params=new URLSearchParams(location.search);const requestedId=params.get('productId')||params.get('product')||'';const STORE_KEY='vm_seller_products';let store={};try{store=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch{}
function findProduct(id){if(store[id])return{key:id,data:store[id]};const decoded=decodeURIComponent(id||'');if(store[decoded])return{key:decoded,data:store[decoded]};const vals=Object.entries(store);for(const [key,data] of vals){if(data&&(String(data.id||data.productId||'')===decoded||String(data.title||'')===decoded||String(data.title||'').toLowerCase()===decoded.toLowerCase()))return{key,data}}return null}
const found=findProduct(requestedId);const storageKey=found?.key||requestedId;const data=found?.data;
if(!data){document.getElementById('notice').textContent='編集対象の商品が見つかりません。商品管理から編集を開いてください。';document.getElementById('notice').classList.add('show');document.getElementById('editForm').querySelectorAll('input,select,textarea,button').forEach(el=>el.disabled=true)}else{
const $=id=>document.getElementById(id);const galleryFiles=[null,null,null,null];
$('title').value=data.title||'';$('category').value=data.category||'Education';$('price').value=data.price||1980;$('description').value=data.description||'';
function imageSrc(item){return typeof item==='object'&&item?.src?item.src:''}
function setVideoPreview(src){const wrap=$('videoPreviewWrap');if(wrap)wrap.innerHTML=src?`<video controls class="preview" style="display:block;max-width:520px;max-height:280px;margin-top:10px"><source src="${src}"></video>`:''}
$('videoName').textContent='現在の動画：'+(data.video||'未設定');if(data.videoDataUrl)setVideoPreview(data.videoDataUrl);
if(data.thumbnail){$('thumbnailPreview').src=data.thumbnail;$('thumbnailPreview').style.display='block'}
const existingGallery=Array.isArray(data.gallery)?data.gallery.slice(0,4):[],grid=$('galleryEditGrid');
for(let i=0;i<4;i++){const card=document.createElement('div');card.style.cssText='border:1px solid #302f34;background:#0c0d0f;padding:10px';card.innerHTML=`<div style="font-size:9px;color:#aaa6a0;margin-bottom:7px">画像 ${String(i+1).padStart(2,'0')}</div><img id="editGalleryPreview${i}" class="preview" style="display:${imageSrc(existingGallery[i])?'block':'none'};max-width:100%;aspect-ratio:16/9;object-fit:cover" alt="画像 ${i+1}"><input id="editGallery${i}" type="file" accept="image/jpeg,image/png,image/webp" style="width:100%;margin-top:8px;color:#99958f;font-size:9px">`;grid.appendChild(card);const img=document.getElementById('editGalleryPreview'+i);if(imageSrc(existingGallery[i]))img.src=imageSrc(existingGallery[i]);document.getElementById('editGallery'+i).addEventListener('change',e=>{const f=e.target.files[0]||null;galleryFiles[i]=f;if(!f)return;const rr=new FileReader();rr.onload=()=>{img.src=String(rr.result);img.style.display='block'};rr.readAsDataURL(f)})}
function publicUrl(){return `/pages/product-detail.html?sellerProductId=${encodeURIComponent(data.id||data.productId||data.title||storageKey)}`}$('publicLink').href=publicUrl();
$('thumbnail').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rr=new FileReader();rr.onload=()=>{data.thumbnail=String(rr.result);$('thumbnailPreview').src=data.thumbnail;$('thumbnailPreview').style.display='block'};rr.readAsDataURL(f)});
$('video').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rr=new FileReader();rr.onload=()=>{data.videoDataUrl=String(rr.result);data.video=f.name;setVideoPreview(data.videoDataUrl);$('videoName').textContent='変更後の動画：'+f.name};rr.readAsDataURL(f)});
$('editForm').addEventListener('submit',async e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('notice').textContent='商品タイトルを入力してください。';$('notice').classList.add('show');return}data.title=title;data.category=$('category').value;data.price=Number($('price').value);data.description=$('description').value;data.updatedAt=new Date().toISOString();const result=[];for(let i=0;i<4;i++){if(galleryFiles[i]){const src=await new Promise((resolve,reject)=>{const rr=new FileReader();rr.onload=()=>resolve(String(rr.result));rr.onerror=reject;rr.readAsDataURL(galleryFiles[i])});result.push({name:galleryFiles[i].name,src})}else if(existingGallery[i])result.push(existingGallery[i])}data.gallery=result;if(!data.id&&!data.productId)data.id='seller-demo-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');store[storageKey]=data;localStorage.setItem(STORE_KEY,JSON.stringify(store));$('publicLink').href=publicUrl();$('notice').textContent='変更を保存しました。サムネイル・動画・4枚の紹介画像・説明文は動画詳細ページにも反映されます。';$('notice').classList.add('show');$('successActions').classList.add('show')})}</script></body></html>
