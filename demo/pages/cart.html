<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カート | VIDEO MARKETPLACE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f3f0e9;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}.page{max-width:1180px;margin:auto;padding:0 5vw 100px}.top{height:82px;border-bottom:1px solid #2d2d31;display:flex;align-items:center;justify-content:space-between}.logo{font-size:14px;letter-spacing:.18em;font-weight:800}.back{color:#9b9891;text-decoration:none;font-size:12px}.hero{padding:65px 0 35px}.kicker{font-size:10px;letter-spacing:.28em;color:#c6a864;font-weight:800}.hero h1{font-size:clamp(42px,5vw,64px);letter-spacing:-.05em;margin:12px 0}.hero p{color:#9b9891;line-height:1.9;font-size:13px}.layout{display:grid;grid-template-columns:1fr 340px;gap:20px}.panel{border:1px solid #303137;background:linear-gradient(145deg,#15161a,#0e0f12);padding:26px}.panel h2{font-size:18px;margin:0 0 20px}.cart-item{display:grid;grid-template-columns:150px 1fr auto;gap:17px;align-items:center;padding:17px 0;border-bottom:1px solid #292a2f}.thumb{width:150px;aspect-ratio:16/9;background-size:cover;background-position:center;border:1px solid #34353a}.cat{font-size:9px;letter-spacing:.2em;color:#c6a864}.title{font-size:17px;font-weight:700;margin:7px 0}.meta{font-size:10px;color:#9b9891;line-height:1.8}.price{font-size:16px;font-weight:800;color:#e4d19c;white-space:nowrap}.remove{margin-top:9px;border:0;background:none;color:#77746f;font-size:10px;cursor:pointer;padding:5px 0}.remove:hover{color:#e4d19c}.summary{position:sticky;top:18px}.line{display:flex;justify-content:space-between;padding:11px 0;color:#aaa6a0;font-size:12px}.total{border-top:1px solid #34353a;margin-top:10px;padding-top:18px;font-size:20px;color:#fff;font-weight:800}.checkout{display:block;width:100%;margin-top:20px;padding:15px;text-align:center;background:linear-gradient(135deg,#c6a864,#9c7d3c);color:#0b0b0c;text-decoration:none;font-weight:900;border:0;cursor:pointer}.clear{width:100%;margin-top:10px;padding:11px;border:1px solid #3a383f;background:#111216;color:#aaa6a0;cursor:pointer}.empty{padding:60px 20px;text-align:center;color:#9b9891}.empty strong{display:block;color:#f3f0e9;font-size:20px;margin-bottom:10px}.empty a{display:inline-block;margin-top:22px;padding:13px 20px;border:1px solid #c6a864;color:#e4d19c;text-decoration:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}.cart-item{grid-template-columns:105px 1fr}.price{grid-column:2}.thumb{width:105px}}@media(max-width:520px){.page{padding:0 20px 70px}.top{height:70px}.cart-item{grid-template-columns:1fr}.thumb{width:100%}.price{grid-column:auto}}
</style></head>
<body><div class="page"><header class="top"><a class="logo" href="/">VIDEO MARKETPLACE</a><a class="back" href="/pages/video-list.html">← 動画を探す</a></header>
<section class="hero"><div class="kicker">SHOPPING CART</div><h1>カート</h1><p>あとで購入したい動画をまとめて管理できます。複数の商品を一度に確認して、そのまままとめて購入できます。</p></section>
<div id="app"></div></div>
<script>
if(localStorage.getItem('vm_auth_role')!=='buyer'){location.replace('/pages/register.html?returnTo='+encodeURIComponent(location.href));}
const KEY='vm_cart';
const fallback={
  1:{id:'1',title:'Creator Masterclass',category:'EDUCATION',seller:'Nova Studio',price:2980,meta:'4K • 78:14',thumb:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80'},
  2:{id:'2',title:'Cinematic Travel Pack',category:'FILM',seller:'Luma Collective',price:2280,meta:'4K • 52:08',thumb:'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80'},
  3:{id:'3',title:'Build Your Digital Product',category:'BUSINESS',seller:'Alex Rivera',price:3480,meta:'1080P • 96:20',thumb:'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=800&q=80'},
  4:{id:'4',title:'Motion Design Toolkit',category:'CREATIVE',seller:'Mika Chen',price:1780,meta:'4K • 41:22',thumb:'https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?auto=format&fit=crop&w=800&q=80'},
  5:{id:'5',title:'Designing Ideas',category:'LEARNING',seller:'Frame Lab',price:2480,meta:'COURSE • 64:12',thumb:'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&w=800&q=80'},
  6:{id:'6',title:'Mountain Silence',category:'LIFESTYLE',seller:'YAMA FILM',price:1200,meta:'NEW • 42:05',thumb:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=800&q=80'}
};
function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?[...new Set(x.map(String))]:[]}catch{return[]}}
function write(items){localStorage.setItem(KEY,JSON.stringify(items));render()}
let remoteSellerProducts={};
function sellerProducts(){try{return JSON.parse(localStorage.getItem('vm_seller_products')||'{}')}catch{return{}}}
function all(){const custom={...sellerProducts(),...remoteSellerProducts};return Object.values(custom).reduce((acc,p)=>{acc[String(p.id)]={id:String(p.id),title:p.title||'販売者動画',category:p.category||'VIDEO',seller:p.seller||'Demo Creator',price:Number(p.price||0),meta:'販売者登録動画',thumb:p.thumbnailData||p.thumbnail||'',sellerProductId:String(p.id)};return acc},Object.fromEntries(Object.entries(fallback).map(([k,v])=>[k,v])))}
function render(){const items=read().map(String);const data=all();const valid=[...new Set(items)].map(id=>data[id]).filter(Boolean);const app=document.getElementById('app');if(!valid.length){app.innerHTML='<section class="panel empty"><strong>カートは空です。</strong><span>気になる動画を追加して、まとめて購入できます。</span><br><a href="/pages/video-list.html">動画を探す →</a></section>';return}
const total=valid.reduce((s,p)=>s+p.price,0);
app.innerHTML='<div class="layout"><section class="panel"><h2>カートの商品 <span style="font-size:11px;color:#77746f">('+valid.length+'件)</span></h2>'+valid.map(p=>'<article class="cart-item"><div class="thumb" style="background-image:url(\''+String(p.thumb).replace(/'/g,'%27')+'\')"></div><div><div class="cat">'+String(p.category).toUpperCase()+'</div><div class="title">'+escapeHtml(p.title)+'</div><div class="meta">'+escapeHtml(p.seller)+'<br>'+escapeHtml(p.meta)+'</div><button class="remove" type="button" data-remove="'+escapeHtml(p.id)+'">カートから削除</button></div><div class="price">¥'+p.price.toLocaleString()+'</div></article>').join('')+'</section><aside class="panel summary"><h2>注文概要</h2><div class="line"><span>商品数</span><span>'+valid.length+'件</span></div><div class="line"><span>商品合計</span><span>¥'+total.toLocaleString()+'</span></div><div class="line"><span>手数料</span><span>¥0</span></div><div class="line total"><span>合計</span><span>¥'+total.toLocaleString()+'</span></div><a class="checkout" href="/pages/checkout.html?cart=1">まとめて購入する →</a><button class="clear" type="button" id="clearCart">カートを空にする</button></aside></div>';
document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>write(read().map(String).filter(id=>id!==String(b.dataset.remove)))));
document.getElementById('clearCart').addEventListener('click',()=>{if(confirm('カートを空にしますか？'))write([])});
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
(async()=>{try{const r=await fetch('/api/demo/state',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const d=await r.json();(d.sellerProducts||[]).forEach(p=>{remoteSellerProducts[String(p.id)]=p});render()}catch(e){}})();
</script></body></html>
