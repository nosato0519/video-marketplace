lass="num">03 / ADMIN</span><h3>あなたは、そのサイトを運営。</h3><p>運営者は管理画面からユーザー、販売者、商品、動画、注文、決済、売上、出金などを一元管理できます。</p><div class="tags"><span>ユーザー管理</span><span>商品管理</span><span>決済管理</span><span>運営管理</span></div></article></div><div class="features-head"><small>FEATURES</small><h3>動画販売を支える、充実した機能。</h3></div><div class="cs-features"><article class="cs-feature"><h4><span>BUYER</span>購入者機能</h4><p>会員登録・ログイン、プロフィール、動画検索、キーワード検索、カテゴリー閲覧、商品一覧、商品詳細、作品プレビュー、カート、購入、決済、購入確認、マイライブラリ、購入履歴、購入済み作品の視聴、ダウンロード、視聴ページ、保護された動画配信。</p></article><article class="cs-feature"><h4><span>CREATOR</span>販売者・クリエイター機能</h4><p>販売者登録、販売者プロフィール、商品登録、動画登録・アップロード、サムネイル・商品画像、タイトル・説明、カテゴリー設定、価格設定、公開・非公開管理、商品管理、販売状況確認、売上確認、売上管理、出金申請、販売者向け導線。</p></article><article class="cs-feature"><h4><span>ADMIN</span>運営・管理機能</h4><p>管理画面、ユーザー管理、販売者管理、販売者承認、商品管理、商品審査・公開管理、動画管理、カテゴリー管理、注文管理、決済管理、売上管理、出金管理、メディア管理、サイト管理、セキュリティ管理、運営全体の一元管理。</p></article><article class="cs-feature"><h4><span>SEARCH &amp; DISCOVERY</span>探す・見つける機能</h4><p>キーワード検索、カテゴリー、人気作品、注目作品、作品一覧、作品詳細、クリエイター紹介、クリエイター一覧、特集・スポットライト、関連コンテンツ、目的の動画へスムーズにたどり着ける導線。</p></article><article class="cs-feature"><h4><span>ORDER &amp; PAYMENT</span>購入・決済機能</h4><p>カート、注文作成、購入フロー、決済処理、注文完了、購入履歴、購入権限の付与、購入後のライブラリ反映、購入済みコンテンツへのアクセス管理。</p></article><article class="cs-feature"><h4><span>MEDIA DELIVERY</span>視聴・配信機能</h4><p>購入済み動画の視聴、保護されたメディアアクセス、ダウンロード対応、未購入コンテンツへのアクセス制御、マイライブラリからの視聴導線、購入権限に応じたコンテンツ提供。</p></article><article class="cs-feature"><h4><span>RESPONSIVE &amp; UX</span>使いやすいサイト設計</h4><p>PC・タブレット・スマートフォンに対応したレスポンシブUI、検索・カテゴリー・購入・視聴までの導線、購入者・販売者・運営者それぞれに分かりやすい画面構成。</p></article><article class="cs-feature"><h4><span>CUSTOMIZE</span>自由なカスタマイズ</h4><p>ロゴ、サイト名、カラー、フォント、画像、動画、カテゴリー、商品情報、メニュー、トップページ、文章、ボタン、コンテンツ、セクション構成、ブランドの世界観、全体デザインまで自由に変更できます。</p></article></div><div class="cs-ready"><h3>このまま運営できる。<br>カスタマイズも、自由。</h3><p>完成した土台を、そのまま自分のサービスへ。教育・オンライン講座・エンタメ・クリエイター作品・フィットネス・音楽・映像作品・ビジネス・企業研修など、さまざまなジャンルの動画販売サイトに展開できます。</p><span class="ready-label">READY TO OPERATE　そのまま運営 ＋ 自由にカスタム</span></div></div>`;const platform=doc.querySelector('.platform');if(!platform)throw new Error('platform section not found');platform.insertAdjacentElement('afterend',section);doc.querySelectorAll('script').forEach(s=>s.remove());document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();}catch(e){document.getElementById('complete-app').innerHTML='<div style="padding:60px;font-family:sans-serif">デモの読み込みに失敗しました。</div>';console.error(e)}})();</script></body></html>
