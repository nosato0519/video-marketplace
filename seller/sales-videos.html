<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今まで売れた動画 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を探す</a><a href="/seller/product-editor.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">SOLD VIDEOS</span>
        <h1>今まで売れた動画</h1>
        <p>これまでに販売された動画ごとの販売日、金額、手数料、利益を確認できます。</p>
      </div>
      <a class="buyer-account" href="/seller/sales.html">売上管理へ戻る →</a>
    </div>

    <section class="buyer-section">
      <div class="buyer-section-head">
        <div>
          <span class="section-kicker">SALES RECORDS</span>
          <h2>販売済み動画</h2>
        </div>
      </div>

      <div id="sold-videos-list" class="seller-video-list"></div>

      <nav id="sold-videos-pagination" class="seller-pagination" aria-label="履歴ページ">
        <a class="is-current" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">次へ →</a>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script type="module">
const list = document.querySelector('#sold-videos-list');
const pagination = document.querySelector('#sold-videos-pagination');

function formatYen(amount) {
  return `¥${Number(amount || 0).toLocaleString('ja-JP')}`;
}

function formatDate(value) {
  return new Date(value).toLocaleDateString('ja-JP').replaceAll('/', '.');
}

async function loadSoldVideos() {
  const response = await fetch('/api/earnings', { credentials: 'same-origin' });
  const body = await response.json().catch(() => null);
  if (!response.ok) {
    const error = new Error(body?.error || '販売履歴を取得できませんでした。');
    error.status = response.status;
    throw error;
  }

  const sales = (body?.earnings || []).filter((item) =>
    ['available', 'paid'].includes(item.status)
  );

  if (!sales.length) {
    list.innerHTML = '<small>販売済み動画はありません。</small>';
    pagination.innerHTML = '';
    return;
  }

  list.innerHTML = sales.map((sale) => `
    <div class="seller-video-row">
      <div class="seller-video-info">
        <strong>${formatDate(sale.created_at)}　${sale.title || '動画'}</strong>
        <small>金額 ${formatYen(sale.gross_amount)}　手数料 ${formatYen(sale.platform_fee)}　利益 ${formatYen(sale.net_amount)}</small>
      </div>
      <span class="seller-video-status is-published">販売済み</span>
      <span class="seller-video-edit">${formatYen(sale.net_amount)}</span>
    </div>
  `).join('');
  pagination.innerHTML = '';
}

loadSoldVideos().catch((error) => {
  if (error.status === 401) window.location.href = '/pages/seller-login.html';
});
</script>
<script src="/shared/site-branding.js"></script></body>
</html>
