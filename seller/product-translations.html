<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product translations</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:36px 20px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;padding:22px;margin-bottom:18px}.row{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}label{font-weight:700}.native{display:block;color:#69717d;font-size:12px;font-weight:400;margin-top:4px}.fields{display:grid;gap:10px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #d7dce2;border-radius:8px;padding:10px}textarea{min-height:110px;resize:vertical}.btn{border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#11151a;color:#fff;border-color:#11151a}.muted{color:#69717d}.status{font-size:12px}.ok{color:#16733d}.missing{color:#9a6500}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><h1>Product translations</h1><p class="muted">Maintain localized titles and descriptions. Saving translations does not change price, ownership, payment or media access.</p><section class="panel"><div id="app">Loading…</div></section></main>
<script>
const productId=new URLSearchParams(location.search).get('productId');const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error?.code||'Request failed');return data}
async function load(){if(!productId){app.textContent='Missing productId.';return}try{const [translations,locales]=await Promise.all([json('/api/products/'+encodeURIComponent(productId)+'/translations'),json('/api/admin/locales')]);const byLocale=Object.fromEntries(translations.map(x=>[x.locale,x]));const enabled=locales.filter(x=>x.enabled);app.innerHTML=enabled.map(x=>{const t=byLocale[x.locale]||{};return `<div class="row"><label>${esc(x.languageName)}<span class="native">${esc(x.nativeName)} · ${esc(x.locale)}</span></label><div class="fields"><span class="status ${t.title?'ok':'missing'}">${t.title?'Translation saved':'Translation missing'}</span><input data-locale="${esc(x.locale)}" data-field="title" value="${esc(t.title||'')}" placeholder="Localized title"><textarea data-locale="${esc(x.locale)}" data-field="description" placeholder="Localized description">${esc(t.description||'')}</textarea><button class="btn primary" data-save="${esc(x.locale)}">Save ${esc(x.nativeName)}</button></div></div>`}).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save));}catch(e){app.textContent=e.message}}
async function save(locale){const title=document.querySelector(`[data-locale="${CSS.escape(locale)}"][data-field="title"]`).value;const description=document.querySelector(`[data-locale="${CSS.escape(locale)}"][data-field="description"]`).value;try{await json('/api/products/'+encodeURIComponent(productId)+'/translations/'+encodeURIComponent(locale),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description})});await load()}catch(e){alert(e.message)}}load();
</script></body></html>
