<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今月の売上履歴 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を探す</a><a href="/seller/product-editor.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">THIS MONTH</span>
        <h1>今月の売上履歴</h1>
        <p>今月売れた動画ごとの売上、手数料、利益を確認できます。</p>
      </div>
      <a class="buyer-account" href="/seller/sales.html">売上管理へ戻る →</a>
    </div>

    <section class="buyer-section">
      <div class="buyer-section-head">
        <div>
          <span id="monthly-period" class="section-kicker">THIS MONTH</span>
          <h2 id="monthly-period-title">今月の販売履歴</h2>
        </div>
      </div>

      <div id="monthly-sales-list" class="seller-video-list"></div>

      <nav id="monthly-sales-pagination" class="seller-pagination" aria-label="履歴ページ">
        <a class="is-current" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">次へ →</a>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script type="module">
const list = document.querySelector('#monthly-sales-list');
const pagination = document.querySelector('#monthly-sales-pagination');

function formatYen(amount) {
  return `¥${Number(amount || 0).toLocaleString('ja-JP')}`;
}

function formatDate(value) {
  return new Date(value).toLocaleDateString('ja-JP').replaceAll('/', '.');
}

async function loadMonthlySales() {
  const response = await fetch('/api/seller/earnings', { credentials: 'same-origin' });
  const body = await response.json().catch(() => null);
  if (!response.ok) {
    const error = new Error(body?.error || '売上履歴を取得できませんでした。');
    error.status = response.status;
    throw error;
  }

  const now = new Date();
  const monthLabel = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long' });
  document.querySelector('#monthly-period').textContent = monthLabel.toUpperCase();
  document.querySelector('#monthly-period-title').textContent = `${monthLabel}の販売履歴`;
  const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const sales = (body?.earnings || []).filter((item) =>
    String(item.created_at || '').slice(0, 7) === monthKey
  );

  if (!sales.length) {
    list.innerHTML = '<small>今月の売上履歴はありません。</small>';
    pagination.innerHTML = '';
    return;
  }

  list.innerHTML = sales.map((sale) => `
    <div class="seller-video-row">
      <div class="seller-video-info">
        <strong>${formatDate(sale.created_at)}　${sale.title || '動画'}</strong>
        <small>売上 ${formatYen(sale.gross_amount)}　手数料 ${formatYen(sale.platform_fee)}　利益 ${formatYen(sale.net_amount)}</small>
      </div>
      <span class="seller-video-status is-published">${sale.status === 'refunded' ? '返金' : '完了'}</span>
      <span class="seller-video-edit">${formatYen(sale.net_amount)}</span>
    </div>
  `).join('');
  pagination.innerHTML = '';
}

loadMonthlySales().catch((error) => {
  if (error.status === 401) window.location.href = '/pages/seller-login.html';
});
</script>
<script src="/shared/site-branding.js"></script></body>
</html>
