<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller — Products</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf0f2}th{font-size:12px;color:#69717d;text-transform:uppercase}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:8px 11px;text-decoration:none;color:#171a1f}.empty{padding:30px}.status{font-size:12px}.status.ok{color:#16733d}@media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Your products</h1><p class="muted">Manage your catalog and localized product content.</p></div><a class="btn" href="/">Storefront</a></div><section class="panel"><table><thead><tr><th>Product</th><th>Status</th><th>Created</th><th>Languages</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty muted">Loading…</td></tr></tbody></table></section></main><script>
const rows=document.getElementById('rows');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/products/mine',{credentials:'same-origin'});const data=await r.json().catch(()=>[]);if(!r.ok)throw new Error(data.error?.code||'Unable to load products');const products=Array.isArray(data)?data:(data.products||[]);if(!products.length){rows.innerHTML='<tr><td colspan="5" class="empty muted">No products yet.</td></tr>';return}const out=[];for(const p of products){let count='—';try{const tr=await fetch('/api/products/'+encodeURIComponent(p.id)+'/translations',{credentials:'same-origin'});if(tr.ok){const t=await tr.json();count=Array.isArray(t)?t.length:'—'}}catch{}out.push(`<tr><td><strong>${esc(p.title||p.name||'Untitled')}</strong><br><span class="muted">${esc(p.id)}</span></td><td><span class="status ${p.status==='published'?'ok':''}">${esc(p.status||'draft')}</span></td><td>${esc(p.created_at||p.createdAt||'—')}</td><td>${esc(count)}</td><td><a class="btn" href="/seller/product-translations.html?productId=${encodeURIComponent(p.id)}">Translations</a></td></tr>`)}rows.innerHTML=out.join('')}catch(e){rows.innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}}load();
</script></body></html>
