<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>動画管理 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page seller-products-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を探す</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">PRODUCT MANAGEMENT</span>
        <h1>動画管理</h1>
        <p>登録した動画の編集・公開状態・翻訳をここからまとめて管理できます。</p>
      </div>
      <a class="buyer-account" href="/seller/product-editor.html">＋ 新しい動画を登録する</a>
    </div>

    <section class="buyer-summary">
      <div><span>登録作品</span><strong id="product-count">0</strong><small>VIDEOS</small></div>
      <div><span>公開中</span><strong id="published-count">0</strong><small>PUBLISHED</small></div>
      <div><span>申請中</span><strong id="review-count">0</strong><small>REVIEW</small></div>
      <div><span>下書き</span><strong id="draft-count">0</strong><small>DRAFT</small></div>
    </section>

    <section class="buyer-section">
      <div class="buyer-section-head">
        <div><span class="section-kicker">YOUR VIDEOS</span><h2>動画一覧</h2></div>
        <div class="seller-products-links">
          <a href="/seller/dashboard.html">販売者マイページ →</a>
        </div>
      </div>

      <div id="seller-product-list" class="seller-video-list"></div>

      <nav class="seller-pagination" aria-label="動画一覧ページ">
        <a class="is-current" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">次へ →</a>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script type="module">
async function loadProducts() {
  const response = await fetch('/api/seller/products', { credentials: 'same-origin' });
  const body = await response.json().catch(() => null);
  if (!response.ok) { const error = new Error(body?.error || '動画情報を取得できませんでした。'); error.status = response.status; throw error; }
  const products = Array.isArray(body?.products) ? body.products : [];
  const counts = products.reduce((result, product) => { result.total += 1; if (product.status === 'published') result.published += 1; if (['submitted','under_review','processing','approved'].includes(product.status)) result.review += 1; if (product.status === 'draft') result.draft += 1; return result; }, { total: 0, published: 0, review: 0, draft: 0 });
  document.querySelector('#product-count').textContent = counts.total.toLocaleString('ja-JP');
  document.querySelector('#published-count').textContent = counts.published.toLocaleString('ja-JP');
  document.querySelector('#review-count').textContent = counts.review.toLocaleString('ja-JP');
  document.querySelector('#draft-count').textContent = counts.draft.toLocaleString('ja-JP');
  const labels = { published: '公開中', submitted: '申請中', under_review: '審査中', processing: '処理中', approved: '承認済み', draft: '下書き', rejected: '却下' };
  const classes = { published: 'is-published', submitted: 'is-pending', under_review: 'is-pending', processing: 'is-pending', approved: 'is-published', draft: 'is-draft', rejected: 'is-rejected' };
  document.querySelector('#seller-product-list').innerHTML = products.length ? products.map((product) => `<div class="seller-video-row"><div class="seller-video-info"><strong>${product.title || '無題の動画'}</strong><small>¥${Number(product.price_amount || 0).toLocaleString('ja-JP')}　${labels[product.status] || product.status}　${new Date(product.created_at).toLocaleDateString('ja-JP').replaceAll('/', '.')}</small></div><span class="seller-video-status ${classes[product.status] || 'is-draft'}">${labels[product.status] || product.status}</span><a href="/seller/product-edit.html" class="seller-video-edit">編集</a></div>`).join('') : '<small>登録されている動画はありません。</small>';
}
loadProducts().catch((error) => { if (error.status === 401) window.location.href = '/pages/seller-login.html'; });
</script>
<script src="/shared/site-branding.js"></script></body>
</html>
