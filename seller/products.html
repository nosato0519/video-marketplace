<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller — Products</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:#fff;border:1px solid #e1e5e9;border-radius:12px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf0f2}th{font-size:12px;color:#69717d;text-transform:uppercase}.muted{color:#69717d}.btn{display:inline-block;border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:8px 11px;text-decoration:none;color:#171a1f;cursor:pointer}.btn.primary{background:#171a1f;color:#fff;border-color:#171a1f}.btn.danger{border-color:#cfd4da}.empty{padding:30px}.status{font-size:12px}.status.ok{color:#16733d}.status.warn{color:#9a6700}.msg{margin:0 0 16px;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid #e1e5e9}.msg.error{border-color:#d99;color:#8a1c1c}.msg.success{border-color:#b7d8c3;color:#166534}@media(max-width:700px){table{display:block;overflow:auto;white-space:nowrap}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1>Your products</h1><p class="muted">Manage your catalog, publishing status, and localized content.</p></div><div class="actions"><a class="btn" href="/">Storefront</a><a class="btn primary" href="/seller/product-editor.html">New product</a></div></div><div id="message" hidden class="msg"></div><section class="panel"><table><thead><tr><th>Product</th><th>Status</th><th>Price</th><th>Created</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty muted">Loading…</td></tr></tbody></table></section></main><script>
const rows=document.getElementById('rows'),message=document.getElementById('message');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showMessage(text,type='success'){message.hidden=false;message.className='msg '+type;message.textContent=text;}
function money(p){const n=Number(p.price_amount);return Number.isFinite(n)?`${esc(p.price_currency||'')} ${n.toFixed(2)}`:'—'}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error?.message||data.error||data.reasons?.join(', ')||'Request failed');return data}
async function changeStatus(id,action){try{await api(`/api/seller/products/${encodeURIComponent(id)}/${action}`,{method:'POST'});showMessage(action==='publish'?'Product published successfully.':'Product unpublished successfully.');await load()}catch(e){showMessage(e.message,'error')}}
async function load(){try{const data=await api('/api/seller/products');const products=Array.isArray(data)?data:(data.products||[]);if(!products.length){rows.innerHTML='<tr><td colspan="5" class="empty muted">No products yet. Create your first product.</td></tr>';return}rows.innerHTML=products.map(p=>{const published=p.status==='published';return `<tr><td><strong>${esc(p.title||'Untitled')}</strong><br><span class="muted">${esc(p.id)}</span></td><td><span class="status ${published?'ok':(p.status==='draft'?'warn':'')}">${esc(p.status||'draft')}</span></td><td>${money(p)}</td><td>${esc(p.created_at||'—')}</td><td><div class="actions"><a class="btn" href="/seller/product-editor.html?productId=${encodeURIComponent(p.id)}">Edit</a><a class="btn" href="/seller/product-translations.html?productId=${encodeURIComponent(p.id)}">Languages</a>${published?`<button class="btn danger" onclick="changeStatus('${esc(p.id)}','unpublish')">Unpublish</button>`:`<button class="btn primary" onclick="changeStatus('${esc(p.id)}','publish')">Publish</button>`}</div></td></tr>`}).join('')}catch(e){rows.innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}}
load();
</script></body></html>
