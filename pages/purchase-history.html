<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>購入履歴 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/cart.html">カート</a><a href="/pages/video-list.html">動画を購入する</a><a href="/pages/seller-register.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">PURCHASE HISTORY</span>
        <h1>購入履歴</h1>
        <p>これまでに購入した動画と注文内容を確認できます。</p>
      </div>
    </div>

    <nav class="buyer-page-nav" aria-label="購入者メニュー">
        <a href="/pages/buyer.html">マイページ</a>
        <a class="" href="/pages/library.html">マイライブラリ</a>
        <a class="active" href="/pages/purchase-history.html">購入履歴</a>
        <a class="" href="/pages/favorites.html">お気に入り</a>
        <a href="/pages/account-settings.html">アカウント設定</a>
      </nav>

    <section class="buyer-section">
      <div class="buyer-section-head">
        <div><span class="section-kicker">ORDERS</span><h2>購入した動画</h2></div>
        <a href="/pages/library.html">マイライブラリ →</a>
      </div>
      <div class="buyer-history-list">
        <div class="empty-state"><h2>購入履歴を読み込んでいます</h2><p>購入済みの注文を確認しています。</p></div>
      </div>
    </section>


    <nav class="catalog-pagination buyer-pagination" data-pagination data-per-page="16" data-item-selector=".buyer-history-card"></nav>
    
  </main>

  <script type="module">
    import { libraryApi } from "/app/library/library-api.js";

    window.renderBuyerHistoryPagination = () => {
      const root = document.querySelector("[data-pagination]");
      const list = document.querySelector(".buyer-history-list");
      if (!root || !list) return;
      const items = Array.from(list.querySelectorAll(".buyer-history-card"));
      const perPage = 16;
      const totalPages = Math.max(1, Math.ceil(items.length / perPage));
      const params = new URLSearchParams(window.location.search);
      const page = Math.min(Math.max(Number(params.get("page")) || 1, 1), totalPages);
      items.forEach((item, index) => {
        item.hidden = index < (page - 1) * perPage || index >= page * perPage;
      });
      root.replaceChildren();
      root.hidden = totalPages <= 1;
      const addLink = (label, target, active = false) => {
        const link = document.createElement("a");
        link.href = target === 1 ? window.location.pathname : window.location.pathname + "?page=" + target;
        link.textContent = label;
        if (active) link.className = "active";
        root.append(link);
      };
      if (page > 1) addLink("‹", page - 1);
      for (let number = 1; number <= totalPages; number += 1) addLink(String(number), number, number === page);
      if (page < totalPages) addLink("›", page + 1);
    };

    const list = document.querySelector(".buyer-history-list");
    if (list) {
      try {
        const result = await libraryApi.orders();
        const orders = result.items || [];
        list.innerHTML = orders.length ? orders.map((order) => {
          const amount = new Intl.NumberFormat("ja-JP", { style: "currency", currency: order.currency || "JPY" }).format(Number(order.amount || 0));
          const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString("ja-JP") : "—";
          return `<article class="buyer-history-card">
            <div class="library-thumb catalog-t1"></div>
            <div class="buyer-history-info">
              <strong>${String(order.title || "購入作品").replace(/[&<>"']/g, "")}</strong>
              <span>購入日 ${date}</span>
              <small>${amount} ・ ${String(order.status || "").replace(/[&<>"']/g, "")}</small>
            </div>
            <a href="/pages/order-detail.html?orderId=${encodeURIComponent(order.orderId)}">注文詳細を見る →</a>
          </article>`;
        }).join("") : `<div class="empty-state"><h2>購入履歴はありません</h2><p>動画を購入すると、ここに履歴が表示されます。</p><a class="button" href="/pages/video-list.html">動画を探す</a></div>`;
        window.renderBuyerHistoryPagination();
      } catch (error) {
        if (error.status === 401) {
          window.location.assign("/pages/buyer-login.html");
        } else {
          list.innerHTML = '<div class="empty-state"><h2>購入履歴を取得できません</h2><p>しばらくしてからもう一度お試しください。</p></div>';
          window.renderBuyerHistoryPagination();
        }
      }
    }
  </script>
  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script src="/shared/site-branding.js"></script></body>
</html>
