<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カート | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/cart.html">カート</a><a href="/pages/video-list.html">動画を購入する</a><a href="/pages/seller-register.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">SHOPPING CART</span>
        <h1>カート</h1>
        <p>購入する動画を確認できます。</p>
      </div>
    </div>

    <nav class="buyer-page-nav" aria-label="購入者メニュー">
      <a href="/pages/buyer.html">マイページ</a>
      <a href="/pages/library.html">マイライブラリ</a>
      <a href="/pages/purchase-history.html">購入履歴</a>
      <a href="/pages/favorites.html">お気に入り</a>
      <a href="/pages/account-settings.html">アカウント設定</a>
    </nav>

    <section class="buyer-section">
      <div class="buyer-section-head">
        <div>
          <span class="section-kicker">CART ITEMS</span>
          <h2>カートの商品</h2>
        </div>
        <span id="cart-item-count">0作品</span>
      </div>

      <div class="buyer-history-list" id="cart-items">
        <p class="announcement-empty">カートを読み込んでいます…</p>
      </div>

      <div class="buyer-summary buyer-summary-spaced">
        <div>
          <span>商品数</span>
          <strong id="cart-summary-count">0</strong>
          <small>作品</small>
        </div>
        <div>
          <span>合計</span>
          <strong id="cart-total">—</strong>
          <small>通貨が同じ作品のみ合算</small>
        </div>
        <div>
          <span>決済</span>
          <strong>未購入</strong>
          <small>購入時に決済</small>
        </div>
        <div>
          <span>購入後</span>
          <strong>視聴可能</strong>
          <small>ライブラリへ追加</small>
        </div>
      </div>
      <div class="cart-checkout">
        <button class="cart-clear-link" id="cart-clear" type="button">カートを空にする</button>
        <button class="primary" id="cart-checkout" type="button" disabled>購入手続きへ</button>
      </div>
      <p id="cart-message" class="microcopy" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script type="module" src="/app/catalog/cart.js"></script>
<script src="/shared/site-branding.js"></script></body>
</html>
