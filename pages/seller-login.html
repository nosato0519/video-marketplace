<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>販売者ログイン | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right"><nav><a href="/pages/video-list.html">動画を購入する</a><a href="#">動画を販売する</a></nav></div>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-kicker">CREATOR ACCOUNT</div>
      <h1 id="login-title">販売者ログイン</h1>
      <p class="auth-lead">動画を販売するアカウントにログインしてください。</p>
      <form id="role-login-form">
        <label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="パスワードを入力" minlength="12" required>
        <div class="auth-options"><label class="auth-check"><input type="checkbox" name="remember"> ログイン状態を保持する</label><a href="/pages/password-reset.html">パスワードを忘れた方</a></div>
        <button class="auth-submit" type="submit">ログイン</button>
        <p id="login-message" class="microcopy" aria-live="polite"></p>
      </form>
      <div class="auth-divider"><span>ACCOUNT</span></div><p class="auth-register">アカウントをお持ちでない方</p>
      <a class="auth-register-link" href="/pages/seller-register.html">販売者登録はこちら</a>
    </section>
  </main>
  <footer class="footer"><div>VIDEO MARKETPLACE</div><span>© 2026 VIDEO MARKETPLACE</span></footer>
<script type="module">
import { loginForRole } from '/app/auth/auth-api.js';
document.querySelector('#role-login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = event.currentTarget;
  const message = form.querySelector('#login-message');
  const submit = form.querySelector('button[type="submit"]');
  submit.disabled = true;
  message.textContent = 'ログインしています…';
  try {
    await loginForRole({
      email: form.email.value,
      password: form.password.value,
      role: 'seller',
      redirectTo: '/seller/dashboard.html'
    });
  } catch (error) {
    message.textContent = error.code === 'ROLE_NOT_ALLOWED'
      ? '販売者アカウントではありません。'
      : (error.body?.error?.message || 'ログインできませんでした。');
    submit.disabled = false;
  }
});
</script>
<script src="/shared/site-branding.js"></script></body>
</html>
