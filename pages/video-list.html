<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>動画を探す | VIDEO MARKETPLACE</title>
  <meta name="description" content="VIDEO MARKETPLACEの動画一覧ページ" />
  <link rel="stylesheet" href="/styles.css?v=production-top" />
</head>
<body class="catalog-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を購入する</a>
        <a href="#">動画を販売する</a>
      </nav>
      <div class="login-menu">
          <button class="sell login-trigger" type="button">ログイン</button>
          <div class="login-dropdown">
            <a href="/pages/seller-login.html">販売者ログイン</a>
            <a href="/pages/buyer-login.html">購入者ログイン</a>
          </div>
        </div>
    </div>
  </header>

  <main>
    <section class="catalog-hero">
      <div>
        <div class="section-kicker">DISCOVER VIDEO</div>
        <h1>動画を探す。</h1>
        <p>映画、学び、ドキュメンタリー、クリエイティブ。<br />あなたが観たい一本を、自由に見つけられます。</p>
      </div>
      <div class="catalog-search">
        <input type="search" aria-label="動画を検索" placeholder="作品名・クリエイター・キーワードで検索" />
        <button type="button">検索</button>
      </div>
    </section>

    <section class="catalog-content">
      <aside class="catalog-sidebar">
        <div class="catalog-sidebar-title">CATEGORY</div>
        <a class="is-active" href="/pages/video-list.html">すべて</a>
        <a href="/pages/category.html?category=movie">映画・映像</a>
        <a href="/pages/category.html?category=learning">学び</a>
        <a href="/pages/category.html?category=documentary">ドキュメンタリー</a>
        <a href="/pages/category.html?category=creative">クリエイティブ</a>
      </aside>

      <section class="catalog-results">
        <div class="catalog-results-head">
          <div>
            <div class="section-kicker">ALL VIDEOS</div>
            <h2>すべての動画</h2>
          </div>
          <select aria-label="並び順">
            <option>おすすめ順</option>
            <option>新着順</option>
            <option>価格の安い順</option>
            <option>評価の高い順</option>
          </select>
        </div>

        <div class="catalog-grid" id="catalog-grid"></div>

        <nav class="catalog-pagination" aria-label="動画一覧ページ">
          <a class="is-active" href="#" aria-current="page">1</a>
        </nav>
      </section>
    </section>
  </main>
<script>
  const grid = document.getElementById('catalog-grid');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));
  }

  function formatPrice(amount, currency) {
    const value = Number(amount);
    if (!Number.isFinite(value)) return '';
    return currency === 'JPY'
      ? `¥${value.toLocaleString('ja-JP')}`
      : `${value.toLocaleString('ja-JP')} ${escapeHtml(currency || '')}`;
  }

  async function loadCatalog() {
    const response = await fetch('/api/catalog/products?limit=24', { credentials: 'same-origin' });
    if (!response.ok) throw new Error('catalog_load_failed');
    const result = await response.json();
    const searchParams = new URLSearchParams(window.location.search);
    const keyword = (searchParams.get('q') || '').trim().toLocaleLowerCase('ja-JP');
    const selectedCategory = (searchParams.get('category') || '').trim().toLocaleLowerCase('ja-JP');
    const minPriceRaw = searchParams.get('minPrice');
    const maxPriceRaw = searchParams.get('maxPrice');
    const minPrice = minPriceRaw !== null && minPriceRaw !== '' ? Number(minPriceRaw) : null;
    const maxPrice = maxPriceRaw !== null && maxPriceRaw !== '' ? Number(maxPriceRaw) : null;
    const categoryAliases = {
      movie: ['movie', '映画・映像', '映画', '映像'],
      learning: ['learning', '学び'],
      documentary: ['documentary', 'ドキュメンタリー'],
      creative: ['creative', 'クリエイティブ']
    };
    const products = (Array.isArray(result.data) ? result.data : []).filter(product => {
      const searchable = [product.title, product.seller, product.category, product.description]
        .filter(Boolean).join(' ').toLocaleLowerCase('ja-JP');
      if (keyword && !searchable.includes(keyword)) return false;
      if (selectedCategory) {
        const aliases = categoryAliases[selectedCategory] || [selectedCategory];
        const productCategory = String(product.category || '').toLocaleLowerCase('ja-JP');
        if (!aliases.some(alias => productCategory === alias.toLocaleLowerCase('ja-JP'))) return false;
      }
      const price = Number(product.price_amount);
      if (minPrice !== null && Number.isFinite(minPrice) && (!Number.isFinite(price) || price < minPrice)) return false;
      if (maxPrice !== null && Number.isFinite(maxPrice) && (!Number.isFinite(price) || price > maxPrice)) return false;
      return true;
    });
    const heading = document.querySelector('.catalog-results-head h2');
    if (heading && (keyword || selectedCategory || minPriceRaw !== null || maxPriceRaw !== null)) {
      heading.textContent = '検索結果（' + products.length + '件）';
    }

    grid.innerHTML = products.map((product, index) => {
      const thumbnail = product.thumbnail_url
        ? `<img class="catalog-thumbnail" src="${escapeHtml(product.thumbnail_url)}" alt="" loading="lazy" style="display:block;width:100%;height:100%;object-fit:cover">`
        : '<span>VIDEO</span>';
      return `
      <a class="catalog-card" href="/pages/product-detail.html?productId=${encodeURIComponent(product.id)}">
        <div class="catalog-thumb catalog-t${(index % 8) + 1}">${thumbnail}</div>
        <div class="catalog-info">
          <div class="catalog-cat">${escapeHtml(product.category || 'VIDEO').toUpperCase()}</div>
          <h3>${escapeHtml(product.title)}</h3>
          <p>by ${escapeHtml(product.seller || '')}</p>
          <strong>${formatPrice(product.price_amount, product.price_currency)}</strong>
        </div>
      </a>`;
    }).join('');

    if (products.length === 0) {
      grid.innerHTML = '<p class="announcement-empty">条件に一致する動画はありません。検索条件を変更してください。</p>';
    }

    grid.querySelectorAll('.catalog-thumbnail').forEach((image) => {
      image.addEventListener('error', () => {
        const fallback = document.createElement('span');
        fallback.textContent = 'VIDEO';
        image.replaceWith(fallback);
      }, { once: true });
    });
  }

  loadCatalog().catch(() => {
    grid.innerHTML = '';
  });
</script>
<script src="/shared/site-branding.js"></script></body>
</html>
