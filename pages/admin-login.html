<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>運営者ログイン | VIDEO MARKETPLACE</title>
  <style>
    body{margin:0;background:#0a0b0d;color:#f3f4f6;font-family:Inter,"Noto Sans JP",Arial,sans-serif}
    .wrap{width:min(520px,90%);margin:auto;padding:100px 0}
    .logo{display:flex!important;flex-direction:row!important;align-items:center!important;gap:12px!important;color:#f4f1eb!important;text-decoration:none!important;line-height:1!important;letter-spacing:0!important}
    .logo .logo-symbol{display:grid!important;place-items:center!important;width:32px!important;height:32px!important;min-width:32px!important;flex:0 0 32px!important;margin:0!important;border:1px solid #d8bd7d!important;border-radius:50%!important;background:linear-gradient(145deg,#25292e,#0b0e12)!important;box-shadow:0 6px 20px rgba(0,0,0,.32)!important}
    .logo .logo-symbol:before{content:""!important;position:static!important;width:0!important;height:0!important;border-top:6px solid transparent!important;border-bottom:6px solid transparent!important;border-left:9px solid #e7d39a!important;transform:none!important;background:none!important}
    .logo .logo-symbol:after,.logo .logo-symbol i{display:none!important}
    .logo .logo-wordmark{display:flex!important;flex-direction:column!important;gap:3px!important;margin:0!important;color:#f4f1eb!important;line-height:1!important}
    .logo .logo-wordmark b{display:block!important;font-size:13px!important;line-height:1!important;letter-spacing:3px!important;font-weight:800!important;color:#f4f1eb!important}
    .logo .logo-wordmark i{display:block!important;margin:0!important;font-size:6px!important;line-height:1!important;letter-spacing:3.6px!important;font-style:normal!important;color:#9299a1!important}
    .card{margin-top:24px;background:#121419;border:1px solid #252932;border-radius:12px;padding:34px}
    .eyebrow{font-size:11px;letter-spacing:.18em;color:#d6b56a}
    .card h1{font-size:32px;margin:10px 0}
    .card h2{font-size:20px;margin:28px 0 8px}
    .card p{color:#8e96a3;line-height:1.8}
    .login{display:block;text-align:center;margin-top:28px;padding:14px;background:#d6b56a;color:#0a0b0d;font-weight:800;border-radius:6px;text-decoration:none}
    .back{display:block;text-align:center;margin-top:18px;color:#8e96a3;font-size:13px;text-decoration:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .card input{box-sizing:border-box;width:100%;margin-top:10px;padding:13px 14px;background:#0a0b0d;color:#f3f4f6;border:1px solid #252932;border-radius:6px}
    .card .login{width:100%;border:0;cursor:pointer;font:inherit}
    .microcopy{min-height:20px;color:#8e96a3;font-size:13px;line-height:1.5;white-space:pre-line}
    .setup{margin-top:34px;padding-top:28px;border-top:1px solid #252932}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>

    <section class="card">
      <div class="eyebrow">OPERATOR ACCOUNT</div>
      <h1>運営者ログイン</h1>
      <p>サイトを管理する運営者アカウントにログインしてください。</p>

      <form id="admin-login-form">
        <label class="sr-only" for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="メールアドレス" required>
        <label class="sr-only" for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="パスワード" minlength="12" required>
        <button class="login" type="submit">ログイン</button>
        <p id="admin-login-message" class="microcopy" aria-live="polite"></p>
      </form>

      <div class="setup">
        <div class="eyebrow">FIRST SETUP</div>
        <h2>初回運営者登録</h2>
        <p>このシステムを初めて設定するときだけ、運営者アカウントを作成できます。</p>

        <form id="admin-setup-form">
          <label class="sr-only" for="setup-email">メールアドレス</label>
          <input id="setup-email" name="email" type="email" autocomplete="email" placeholder="運営者メールアドレス" required maxlength="254">
          <label class="sr-only" for="setup-password">パスワード</label>
          <input id="setup-password" name="password" type="password" autocomplete="new-password" placeholder="パスワード（12文字以上）" minlength="12" maxlength="256" required>
          <label class="sr-only" for="setup-password-confirm">パスワード（確認）</label>
          <input id="setup-password-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="パスワード（確認）" minlength="12" maxlength="256" required>
          <label class="sr-only" for="setup-token">初期設定キー</label>
          <input id="setup-token" name="setup-token" type="password" autocomplete="off" placeholder="初期設定キー" required>
          <button class="login" type="submit">運営者アカウントを作成</button>
          <p id="admin-setup-message" class="microcopy" aria-live="polite"></p>
        </form>
      </div>

      <a class="back" href="/">← TOPへ戻る</a>
    </section>
  </main>

  <script type="module" src="/app/auth/auth-view.js"></script>
  <script src="/shared/site-branding.js"></script>
</body>
</html>
