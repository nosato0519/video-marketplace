<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パスワード再設定 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を購入する</a>
        <a href="#">動画を販売する</a>
      </nav>
    </div>
  </header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="reset-title">
      <div class="auth-kicker">ACCOUNT SECURITY</div>
      <h1 id="reset-title">パスワード再設定</h1>
      <p class="auth-lead">登録しているメールアドレスを入力してください。パスワード再設定の案内を送信します。</p>
      <form>
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
        <button class="auth-submit" type="submit">再設定メールを送信</button>
      </form>
      <div class="auth-divider"><span>ACCOUNT</span></div>
      <a class="auth-register-link" href="/pages/buyer-login.html">購入者ログインへ戻る</a>
    </section>
  </main>
  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script src="/shared/site-branding.js"></script></body>
</html>
