<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>視聴ページ | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="watch-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/cart.html">カート</a><a href="/pages/video-list.html">動画を購入する</a><a href="/pages/seller-register.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
    <button class="hamb">☰</button>
  </header>

  <main class="watch-main">
    <div class="watch-breadcrumb">HOME / MY LIBRARY</div>

    <section class="watch-player">
      <div class="watch-screen">
        <div class="watch-placeholder">購入した動画を読み込んでいます…</div>
      </div>
    </section>

    <section class="watch-info">
      <div>
        <span class="section-kicker">NOW WATCHING</span>
        <h1>購入作品</h1>
        <p>購入した動画の作品情報を読み込んでいます。</p>
        <div class="watch-meta"></div>
      </div>
      <div class="watch-actions">
        <a class="watch-download" href="#">↓ ダウンロード</a>
        <a class="watch-library-link" href="/pages/library.html">マイライブラリへ戻る</a>
      </div>
    </section>

    <section class="watch-details">
      <div>
        <div class="detail-section-label">ABOUT THIS VIDEO</div>
        <h2>作品について</h2>
        <p>購入した動画の説明を読み込んでいます。</p>
      </div>
      <div class="watch-facts">
        <div><small>FORMAT</small><strong data-watch-format>—</strong></div>
        <div><small>STREAMING</small><strong data-watch-streaming>—</strong></div>
        <div><small>DOWNLOAD</small><strong data-watch-download>—</strong></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { libraryApi } from "/app/library/library-api.js";
    import { mediaStreamUrl, mediaDownloadUrl } from "/app/library/media-api.js";

    const productId = new URLSearchParams(window.location.search).get("productId");
    const screen = document.querySelector(".watch-screen");
    const download = document.querySelector(".watch-download");
    const title = document.querySelector(".watch-info h1");
    const description = document.querySelector(".watch-info p");
    const breadcrumb = document.querySelector(".watch-breadcrumb");
    const meta = document.querySelector(".watch-meta");
    const details = document.querySelector(".watch-details p");
    const watchFacts = {
      format: document.querySelector("[data-watch-format]"),
      streaming: document.querySelector("[data-watch-streaming]"),
      download: document.querySelector("[data-watch-download]"),
    };

    if (!productId) {
      window.location.assign("/pages/library.html");
    } else {
      const controller = new AbortController();
      const timeoutId = window.setTimeout(() => controller.abort(), 15000);
      try {
        const result = await libraryApi.list({ signal: controller.signal });
        const item = (result.items || []).find((entry) => String(entry.product_id) === productId);
        if (!item) {
          window.location.assign("/pages/library.html");
        } else {
          const productTitle = item.title || "購入作品";
          if (title) title.textContent = productTitle;
          if (breadcrumb) breadcrumb.textContent = "HOME / MY LIBRARY / " + productTitle;
          if (description) description.textContent = item.description || "購入した動画を視聴できます。";
          if (details) details.textContent = item.description || "購入した動画を視聴できます。";
          if (watchFacts.format) watchFacts.format.textContent = item.media_mime_type || "動画";
          if (watchFacts.streaming) watchFacts.streaming.textContent = item.streaming_enabled && item.media_status === "ready" ? "視聴可能" : "視聴準備中";
          if (watchFacts.download) watchFacts.download.textContent = item.download_enabled && item.media_status === "ready" ? "ダウンロード可能" : "ダウンロード不可";
          if (meta) {
            meta.replaceChildren();
            [item.media_mime_type || "動画", item.streaming_enabled && item.media_status === "ready" ? "視聴可能" : "視聴準備中"]
              .forEach((value) => {
                const span = document.createElement("span");
                span.textContent = value;
                meta.append(span);
              });
          }
          if (screen) {
            screen.replaceChildren();
            if (item.streaming_enabled && item.media_status === "ready") {
              const video = document.createElement("video");
              video.controls = true;
              video.preload = "metadata";
              if (item.thumbnail_url) video.poster = item.thumbnail_url;
              video.style.cssText = "width:100%;height:100%;object-fit:contain;background:#000";
              video.src = mediaStreamUrl(productId);
              video.addEventListener("error", () => {
                const notice = document.createElement("p");
                notice.className = "empty-state";
                notice.textContent = "動画を再生できません。購入状態と配信設定をご確認ください。";
                screen.replaceChildren(notice);
              }, { once: true });
              screen.append(video);
            } else {
              const notice = document.createElement("p");
              notice.className = "empty-state";
              notice.textContent = "この作品は現在視聴準備中です。";
              screen.append(notice);
            }
          }
          if (download) {
            if (item.download_enabled && item.media_status === "ready") {
              download.href = mediaDownloadUrl(productId);
            } else {
              download.hidden = true;
            }
          }
        }
      } catch (error) {
        if (error.status === 401) {
          window.location.assign("/pages/buyer-login.html");
        } else {
          if (screen) screen.textContent = error.name === "AbortError"
            ? "作品情報の読み込みがタイムアウトしました。ページを再読み込みしてください。"
            : "購入済み作品を読み込めませんでした。時間をおいて再度お試しください。";
          if (download) download.hidden = true;
        }
      } finally {
        window.clearTimeout(timeoutId);
      }
    }
  </script>
  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script src="/shared/site-branding.js"></script></body>
</html>
