<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>注文詳細 | VIDEO MARKETPLACE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="library-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を購入する</a>
        <a href="/pages/seller-register.html">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
  </header>

  <main class="buyer-main">
    <div class="buyer-head">
      <div>
        <span class="section-kicker">ORDER DETAIL</span>
        <h1>注文詳細</h1>
        <p>購入した注文の内容と決済情報を確認できます。</p>
      </div>
      <a class="buyer-account" href="/pages/purchase-history.html">購入履歴へ戻る</a>
    </div>

    <nav class="buyer-page-nav" aria-label="購入者メニュー">
      <a href="/pages/buyer.html">マイページ</a>
      <a href="/pages/library.html">マイライブラリ</a>
      <a href="/pages/purchase-history.html">購入履歴</a>
      <a href="/pages/favorites.html">お気に入り</a>
      <a href="/pages/account-settings.html">アカウント設定</a>
    </nav>

    <div id="order-content">
      <section class="buyer-section">
        <div class="empty-state"><h2>注文を読み込んでいます</h2></div>
      </section>
    </div>

  </main>

  <footer class="footer">
    <div>VIDEO MARKETPLACE</div>
    <span>© 2026 VIDEO MARKETPLACE</span>
  </footer>
<script src="/shared/site-branding.js"></script>
<script type="module">
  import { libraryApi } from "/app/library/library-api.js";
  const content = document.querySelector("#order-content");
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  try {
    const orderId = new URLSearchParams(window.location.search).get("orderId");
    if (!orderId) throw new Error("ORDER_NOT_FOUND");
    const result = await libraryApi.orders();
    const order = (result.items || []).find((item) => String(item.orderId) === String(orderId));
    if (!order) throw new Error("ORDER_NOT_FOUND");
    const amount = new Intl.NumberFormat("ja-JP", { style: "currency", currency: order.currency || "JPY" }).format(Number(order.amount || 0));
    const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString("ja-JP") : "—";
    const status = order.status || "—";
    const title = escapeHtml(order.title || "購入作品");
    const safeOrderId = escapeHtml(order.orderId);
    const safeDate = escapeHtml(date);
    const safeAmount = escapeHtml(amount);
    const safeCurrency = escapeHtml(order.currency || "JPY");
    const safeStatus = escapeHtml(status);
    content.innerHTML = '<section class="buyer-section"><div class="buyer-section-head"><div><span class="section-kicker">ORDER</span><h2>注文 #' + safeOrderId + '</h2></div><span>' + safeStatus + '</span></div><div class="buyer-history-list"><article class="buyer-history-card"><div class="library-thumb catalog-t1"></div><div class="buyer-history-info"><strong>' + title + '</strong><span>購入日 ' + safeDate + '</span><small>' + safeAmount + '</small></div><a href="/pages/library.html">ライブラリで見る →</a></article></div></section>' + '<section class="buyer-section"><div class="buyer-section-head"><div><span class="section-kicker">PAYMENT</span><h2>決済情報</h2></div></div><div class="buyer-summary buyer-order-summary"><div><span>商品数</span><strong>1</strong><small>作品</small></div><div><span>購入金額</span><strong>' + safeAmount + '</strong><small>' + safeCurrency + '</small></div><div><span>決済状態</span><strong>' + safeStatus + '</strong><small>注文ステータス</small></div><div><span>購入日</span><strong>' + safeDate + '</strong><small>注文日時</small></div></div></section>' + '<section class="buyer-section"><div class="buyer-section-head"><div><span class="section-kicker">LIBRARY</span><h2>購入後の操作</h2></div></div><div class="buyer-action-row"><a class="buyer-account" href="/pages/purchase-history.html">購入履歴へ戻る</a><a class="primary" href="/pages/library.html">マイライブラリへ →</a></div></section>';
  } catch (error) {
    if (error.status === 401) {
      window.location.assign("/pages/buyer-login.html");
    } else {
      content.innerHTML = '<section class="buyer-section"><div class="empty-state"><h2>注文を取得できません</h2><p>購入履歴から対象の注文を選択してください。</p><a class="button" href="/pages/purchase-history.html">購入履歴へ戻る</a></div></section>';
    }
  }
</script>
</body>
</html>
