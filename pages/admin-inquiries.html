<script>
(function(){
try{
const items=JSON.parse(localStorage.getItem('vm-demo-inquiries')||'[]'),body=document.getElementById('inquiry-rows');
items.forEach(item=>{
const tr=document.createElement('tr');tr.dataset.type=item.type||'購入者';tr.dataset.status=item.status||'未対応';tr.dataset.message=item.message||'';tr.dataset.search=[item.id,item.type,item.name,item.subject,item.category].join(' ');
const values=[item.id,item.type,item.name,item.category,item.date];
const c0=document.createElement('td'),id=document.createElement('b'),subject=document.createElement('small');id.textContent=item.id;subject.textContent=item.subject;c0.append(id,subject);
const c1=document.createElement('td');c1.append(document.createTextNode(item.type||'購入者'),document.createElement('br'));const name=document.createElement('small');name.textContent=item.name;c1.append(name);
const c2=document.createElement('td');c2.textContent=item.category||'その他';
const c3=document.createElement('td');c3.textContent=item.date||'登録直後';
const c4=document.createElement('td'),tag=document.createElement('span');tag.className='tag warn status-tag';tag.textContent=item.status||'未対応';c4.append(tag);
const c5=document.createElement('td'),button=document.createElement('button');button.type='button';button.className='btn small inquiry-open';button.textContent='詳細';c5.append(button);
tr.append(c0,c1,c2,c3,c4,c5);body.prepend(tr);
});
}catch(e){}
})();
</script>
<script>
(function(){
const rows=[...document.querySelectorAll('#inquiry-rows tr')], search=document.getElementById('inquiry-search'), type=document.getElementById('inquiry-type'), status=document.getElementById('inquiry-status');
let current=null;
function filter(){const q=search.value.trim().toLowerCase();rows.forEach(r=>{r.hidden=!(r.dataset.search.toLowerCase().includes(q)&&(!type.value||r.dataset.type===type.value)&&(!status.value||r.dataset.status===status.value));});document.getElementById('inquiry-empty').hidden=rows.some(r=>!r.hidden);}
function counts(){const c={'未対応':0,'対応中':0,'返信待ち':0,'解決済み':0};rows.forEach(r=>c[r.dataset.status]++);document.getElementById('count-new').innerHTML=c['未対応']+' <em>件</em>';document.getElementById('count-working').innerHTML=c['対応中']+' <em>件</em>';document.getElementById('count-waiting').innerHTML=c['返信待ち']+' <em>件</em>';document.getElementById('count-done').innerHTML=c['解決済み']+' <em>件</em>';}
[search,type,status].forEach(el=>el.addEventListener('input',filter));
rows.forEach(r=>r.querySelector('.inquiry-open').addEventListener('click',()=>{current=r;document.getElementById('inquiry-detail').hidden=false;document.getElementById('detail-title').textContent=r.cells[0].querySelector('small').textContent;document.getElementById('detail-meta').textContent=r.cells[0].querySelector('b').textContent+' ・ '+r.cells[1].innerText.replace('\n',' / ')+' ・ '+r.cells[3].textContent;document.getElementById('detail-status').value=r.dataset.status;document.getElementById('detail-message').textContent=r.dataset.message||('お問い合わせありがとうございます。'+r.cells[0].querySelector('small').textContent+'。内容を確認し、必要な対応を行ってください。');document.getElementById('detail-reply').value='';document.getElementById('reply-preview').hidden=true;document.getElementById('inquiry-detail').scrollIntoView({behavior:'smooth',block:'start'});}));
document.getElementById('close-detail').addEventListener('click',()=>document.getElementById('inquiry-detail').hidden=true);
document.getElementById('save-status').addEventListener('click',()=>{if(!current)return;current.dataset.status=document.getElementById('detail-status').value;const tag=current.querySelector('.status-tag');tag.textContent=current.dataset.status;tag.className='tag status-tag'+(current.dataset.status==='未対応'?' warn':current.dataset.status==='解決済み'?' ok':'');try{const id=current.cells[0].querySelector('b').textContent;const items=JSON.parse(localStorage.getItem('vm-demo-inquiries')||'[]');const item=items.find(x=>x.id===id);if(item){item.status=current.dataset.status;localStorage.setItem('vm-demo-inquiries',JSON.stringify(items));}}catch(e){}filter();counts();});
document.getElementById('preview-reply').addEventListener('click',()=>{const v=document.getElementById('detail-reply').value.trim(),p=document.getElementById('reply-preview');p.hidden=false;p.innerHTML='<strong>返信プレビュー</strong><p></p>';p.querySelector('p').textContent=v||'返信文が入力されていません。';});
counts();filter();
})();
</script>

<script>
(function(){
var tableIds=["inquiry-table"];
function setup(tableId){
 var table=document.getElementById(tableId);if(!table||!table.tBodies.length)return;
 var section=table.closest('section')||table.parentElement;
 var rows=Array.from(table.tBodies[0].rows),pageSize=20,currentPage=1,filteredRows=[];
 var nav=document.createElement('nav');nav.className='table-pagination';nav.setAttribute('aria-label','一覧ページ切り替え');
 var summary=document.createElement('span');summary.className='pagination-summary';
 var controls=document.createElement('div');controls.className='pagination-controls';
 nav.append(summary,controls);var panel=table.closest('.panel');(panel||table).insertAdjacentElement('afterend',nav);
 function capture(){rows=Array.from(table.tBodies[0].rows);filteredRows=rows.filter(function(row){return !row.hidden;});var pages=Math.max(1,Math.ceil(filteredRows.length/pageSize));currentPage=Math.min(currentPage,pages);render();}
 function render(){
  var pages=Math.max(1,Math.ceil(filteredRows.length/pageSize));currentPage=Math.max(1,Math.min(currentPage,pages));
  rows.forEach(function(row){row.hidden=true;});
  filteredRows.slice((currentPage-1)*pageSize,currentPage*pageSize).forEach(function(row){row.hidden=false;});
  summary.textContent=filteredRows.length+'件中 '+(filteredRows.length?((currentPage-1)*pageSize+1):0)+'–'+Math.min(currentPage*pageSize,filteredRows.length)+'件を表示';
  controls.replaceChildren();
  function add(label,page,disabled,active,aria){var b=document.createElement('button');b.type='button';b.className='pagination-button'+(active?' active':'');b.textContent=label;b.disabled=!!disabled;if(aria)b.setAttribute('aria-label',aria);if(active)b.setAttribute('aria-current','page');b.addEventListener('click',function(){currentPage=page;render();});controls.appendChild(b);}
  add('前へ',currentPage-1,currentPage===1,false,'前のページ');
  var shown=new Set();[1,currentPage-2,currentPage-1,currentPage,currentPage+1,currentPage+2,pages].forEach(function(p){if(p>=1&&p<=pages)shown.add(p);});
  var sorted=Array.from(shown).sort(function(a,b){return a-b;}),previous=0;
  sorted.forEach(function(p){if(previous&&p-previous>1){var dots=document.createElement('span');dots.className='pagination-ellipsis';dots.textContent='…';controls.appendChild(dots);}add(String(p),p,false,p===currentPage,'ページ '+p);previous=p;});
  add('次へ',currentPage+1,currentPage===pages,false,'次のページ');
 }
 function refreshFromFilter(){currentPage=1;capture();}
 section.querySelectorAll('input,select').forEach(function(el){el.addEventListener('input',refreshFromFilter);el.addEventListener('change',refreshFromFilter);});
 section.addEventListener('click',function(event){if(event.target.closest('button[data-action]'))refreshFromFilter();});
 var save=document.getElementById('save-status');if(save)save.addEventListener('click',refreshFromFilter);
 capture();
}
tableIds.forEach(setup);
})();
</script>
