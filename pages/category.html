<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>カテゴリー | VIDEO MARKETPLACE</title>
  <meta name="description" content="カテゴリーから動画を探す | VIDEO MARKETPLACE">
  <link rel="stylesheet" href="/styles.css?v=production-top">
</head>
<body class="catalog-page">
  <header class="nav">
    <a class="logo" href="/" aria-label="VIDEO MARKETPLACE">
      <span class="logo-symbol" aria-hidden="true"><i></i></span>
      <span class="logo-wordmark"><b>VIDEO</b><i>MARKETPLACE</i></span>
    </a>
    <div class="nav-right">
      <nav>
        <a href="/pages/video-list.html">動画を購入する</a>
        <a href="#">動画を販売する</a>
      </nav>
      <div class="login-menu">
        <button class="sell login-trigger" type="button">ログイン</button>
        <div class="login-dropdown">
          <a href="/pages/seller-login.html">販売者ログイン</a>
          <a href="/pages/buyer-login.html">購入者ログイン</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="catalog-hero">
      <div>
        <div class="section-kicker">CATEGORY</div>
        <h1 id="category-title">カテゴリーから探す。</h1>
        <p id="category-description">興味のあるカテゴリーから、あなたが観たい動画を見つけられます。</p>
      </div>
      <div class="catalog-search">
        <input type="search" aria-label="動画を検索" placeholder="作品名・クリエイター・キーワードで検索">
        <button type="button">検索</button>
      </div>
    </section>

    <section class="catalog-content">
      <aside class="catalog-sidebar">
        <div class="catalog-sidebar-title">CATEGORY</div>
        <a href="/pages/video-list.html">すべて</a>
        <a data-category="movie" href="/pages/category.html?category=movie">映画・映像</a>
        <a data-category="learning" href="/pages/category.html?category=learning">学び</a>
        <a data-category="documentary" href="/pages/category.html?category=documentary">ドキュメンタリー</a>
        <a data-category="creative" href="/pages/category.html?category=creative">クリエイティブ</a>
      </aside>

      <section class="catalog-results">
        <div class="catalog-results-head">
          <div>
            <div class="section-kicker">CATEGORY VIDEOS</div>
            <h2 id="category-heading">動画</h2>
          </div>
          <select aria-label="並び順">
            <option>おすすめ順</option>
            <option>新着順</option>
            <option>価格の安い順</option>
            <option>評価の高い順</option>
          </select>
        </div>

        <div class="catalog-grid" id="category-grid" data-published-listings="category"><p class="announcement-empty">公開中の動画を読み込んでいます。</p></div>

        <nav class="catalog-pagination" aria-label="カテゴリー動画ページ">
          <a class="is-active" href="#" aria-current="page">1</a>
        </nav>
      </section>
    </section>
  </main>

  <script>
    const categories={
      film:{name:'映画・映像',description:'映画・映像作品から、観たい一本を見つけられます.'},
      education:{name:'学び',description:'講座・チュートリアル・スキルを学べる動画を集めています.'},
      documentary:{name:'ドキュメンタリー',description:'人・街・社会・自然を描いたドキュメンタリー作品.'},
      creative:{name:'クリエイティブ',description:'映像制作・デザイン・表現に関する作品を集めています.'},
      business:{name:'ビジネス',description:'仕事・マーケティング・ブランドづくりに役立つ動画.'},
      lifestyle:{name:'ライフスタイル',description:'暮らし・趣味・体験を楽しめる動画を集めています.'},
      music:{name:'音楽',description:'音楽・ライブ・サウンドに関する映像作品.'}
    };
    const key=new URLSearchParams(location.search).get('category')||'film';
    const category=categories[key]||categories.film;
    document.title=category.name+' | VIDEO MARKETPLACE';
    document.getElementById('category-title').textContent=category.name+'から探す。';
    document.getElementById('category-heading').textContent=category.name+'の動画';
    document.getElementById('category-description').textContent=category.description;
    document.querySelectorAll('[data-category]').forEach(el=>el.classList.toggle('is-active',el.dataset.category===key));
    // Published listings are rendered from the catalog API by published-listings.js.
  </script>
<script src="/app/catalog/published-listings.js" defer></script>
<script src="/shared/site-branding.js"></script></body>
</html>
