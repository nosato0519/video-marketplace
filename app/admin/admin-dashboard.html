<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Market Admin Dashboard</title><meta http-equiv="Cache-Control" content="no-store"><style>body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:Inter,system-ui,sans-serif}.admin-shell{max-width:1100px;margin:auto;padding:36px 20px}.admin-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{color:#9aa4af;font-size:12px;text-transform:uppercase}.admin-header h1{margin:0 0 8px}.admin-header p{color:#9aa4af}.button{display:inline-block;padding:9px 12px;border:1px solid #30363d;border-radius:8px;color:#fff;text-decoration:none}.secondary{background:#12161b}.admin-alert,.admin-stats article,.admin-card{background:#12161b;border:1px solid #20262d;border-radius:12px}.admin-alert{padding:15px;margin:22px 0;display:flex;gap:10px;flex-direction:column}.admin-alert span,.admin-card span,.admin-footnote{color:#9aa4af}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.admin-stats article{padding:16px;display:flex;flex-direction:column;gap:8px}.admin-stats span{font-size:12px;color:#9aa4af}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.admin-card{padding:18px;text-decoration:none;color:#fff;display:flex;flex-direction:column;gap:7px}.admin-card:hover{border-color:#59636f}.admin-footnote{font-size:12px;line-height:1.6;margin-top:22px}@media(max-width:800px){.admin-stats{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.admin-header{flex-direction:column}.admin-stats,.admin-grid{grid-template-columns:1fr}}</style></head><body><div id="root"></div><script type="module">import{renderAdminDashboard}from'./admin-dashboard.js';document.getElementById('root').innerHTML=renderAdminDashboard();</script></body></html>
