<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderation — Admin</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,select,textarea{border:1px solid rgba(255,255,255,.15);background:#12161b;color:#fff;border-radius:8px;padding:9px 11px}.btn{cursor:pointer}.primary{background:#fff;color:#090b0e;font-weight:700}.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}.tab.active{background:#fff;color:#090b0e}.panel{background:#12161b;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px}.muted{color:#9aa4af}.error{padding:12px;border:1px solid #733;border-radius:8px;color:#f5b7b7}.success{padding:12px;border:1px solid #375b43;border-radius:8px;color:#b9e3c5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;font-size:13px}th{font-size:11px;color:#9aa4af;text-transform:uppercase}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#20262d}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 8px;font-size:12px}.hidden{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}.modal-card{width:min(620px,100%);background:#12161b;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:20px}.modal textarea{width:100%;min-height:120px;resize:vertical;margin:10px 0}.danger{border-color:#754040}@media(max-width:700px){.top{flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Content Moderation</h1><p class="muted">Review submitted content, investigate reports, and record moderation actions.</p></div><div class="actions"><a class="btn" href="/admin/">Admin Dashboard</a></div></header><div id="message"></div><div class="tabs"><button class="btn tab active" data-view="reviews">Content Reviews</button><button class="btn tab" data-view="reports">Reports</button></div><section class="panel"><div class="actions" style="margin-bottom:14px"><select id="filter"><option value="">All statuses</option></select><button class="btn" id="refresh">Refresh</button></div><div id="content" class="muted">Loading…</div></section></main><div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modal-title">Action</h2><p id="modal-copy" class="muted"></p><textarea id="reason" maxlength="2000" placeholder="Reason / moderation notes"></textarea><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="confirm">Confirm</button></div></div></div><script>
const content=document.getElementById('content'),message=document.getElementById('message'),filter=document.getElementById('filter'),modal=document.getElementById('modal'),reason=document.getElementById('reason');let view='reviews',pending=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(r.status===401||r.status===403)throw Error('Administrator authentication or permission is required.');if(!r.ok)throw Error(d.error?.message||d.error||'Request failed');return d}
function setMessage(text,type='success'){message.innerHTML=text?`<p class="${type}">${esc(text)}</p>`:''}
function reviewStatuses(current){const map={pending:['approved','rejected','changes_requested','blocked'],changes_requested:['pending','rejected','blocked'],approved:['blocked'],rejected:['pending'],blocked:['pending']};return map[current]||[]}
function reportStatuses(current){const map={open:['reviewing','resolved','dismissed'],reviewing:['resolved','dismissed'],dismissed:['reviewing'],resolved:[]};return map[current]||[]}
function openAction(title,copy,action){pending=action;document.getElementById('modal-title').textContent=title;document.getElementById('modal-copy').textContent=copy;reason.value='';modal.classList.remove('hidden')}
function closeModal(){pending=null;modal.classList.add('hidden')}
async function load(){setMessage('');content.innerHTML='<div class="muted">Loading…</div>';try{if(view==='reviews')await loadReviews();else await loadReports()}catch(e){content.innerHTML='';setMessage(e.message,'error')}}
async function loadReviews(){const q=filter.value?`?status=${encodeURIComponent(filter.value)}`:'';const d=await api('/api/admin/content/reviews'+q);const rows=d.reviews||[];content.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Seller</th><th>Status</th><th>Reason</th><th>Created</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.product_title||r.product_id)}</strong><br><span class="muted">${esc(r.product_id)}</span></td><td>${esc(r.seller_email||'—')}</td><td><span class="status">${esc(r.status)}</span></td><td>${esc(r.reason_code||'—')}<br>${esc(r.notes||'')}</td><td>${esc(r.created_at||'')}</td><td><div class="row-actions">${reviewStatuses(r.status).map(s=>`<button class="btn small" data-review="${esc(r.id)}" data-status="${esc(s)}">${esc(s)}</button>`).join('')}<button class="btn small danger" data-takedown="${esc(r.product_id)}">Takedown</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No content reviews found.</div>'}
async function loadReports(){const q=filter.value?`?status=${encodeURIComponent(filter.value)}`:'';const d=await api('/api/admin/content/reports'+q);const rows=d.reports||[];content.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Product</th><th>Reporter</th><th>Status</th><th>Reason</th><th>Description</th><th>Created</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.product_title||r.product_id||'—')}</td><td>${esc(r.reporter_email||r.reporter_id||'—')}</td><td><span class="status">${esc(r.status)}</span></td><td>${esc(r.reason_code||'—')}</td><td>${esc(r.description||'')}</td><td>${esc(r.created_at||'')}</td><td><div class="row-actions">${reportStatuses(r.status).map(s=>`<button class="btn small" data-report="${esc(r.id)}" data-status="${esc(s)}">${esc(s)}</button>`).join('')}<button class="btn small danger" data-takedown="${esc(r.product_id)}">Takedown</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No reports found.</div>'}
async function action(){if(!pending)return;try{if(pending.type==='review'){await api(`/api/admin/content/reviews/${encodeURIComponent(pending.id)}/status`,{method:'POST',body:JSON.stringify({status:pending.status,notes:reason.value.trim()})})}else if(pending.type==='report'){await api(`/api/admin/content/reports/${encodeURIComponent(pending.id)}/status`,{method:'POST',body:JSON.stringify({status:pending.status})})}else{if(!reason.value.trim())throw Error('A takedown reason is required.');await api(`/api/admin/content/${encodeURIComponent(pending.productId)}/takedown`,{method:'POST',body:JSON.stringify({reason:reason.value.trim()})})}closeModal();setMessage('Moderation action completed.');await load()}catch(e){setMessage(e.message,'error')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;filter.innerHTML='<option value="">All statuses</option>';const values=view==='reviews'?['pending','changes_requested','approved','rejected','blocked']:['open','reviewing','resolved','dismissed'];values.forEach(v=>filter.insertAdjacentHTML('beforeend',`<option value="${v}">${v}</option>`));load()});document.getElementById('refresh').onclick=load;filter.onchange=load;document.getElementById('cancel').onclick=closeModal;document.getElementById('confirm').onclick=action;content.onclick=e=>{const review=e.target.closest('[data-review]'),report=e.target.closest('[data-report]'),td=e.target.closest('[data-takedown]');if(review)openAction('Change review status',`Set review ${review.dataset.id} to ${review.dataset.status}. Rejection, changes requested, and blocked states require notes.`,{type:'review',id:review.dataset.id,status:review.dataset.status});else if(report)openAction('Change report status',`Set report ${report.dataset.id} to ${report.dataset.status}.`,{type:'report',id:report.dataset.id,status:report.dataset.status});else if(td)openAction('Takedown content',`Block product ${td.dataset.takedown}. This creates an audit record.`,{type:'takedown',productId:td.dataset.takedown})};load();
</script></body></html>
