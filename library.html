<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Library — Video Market</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.nav{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#9aa4af}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#12161b;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.error{padding:12px;border:1px solid #733;border-radius:8px;color:#f5b7b7}.empty{padding:40px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><h1>My Library</h1><p class="muted">Your purchased videos. Playback and downloads are authorized by the server.</p></div><nav class="nav" aria-label="Account navigation"><a class="btn" href="/account.html">My Account</a><a class="btn" href="/orders.html">Order History</a><a class="btn" href="/">Storefront</a></nav></header><div id="message"></div><section id="items" class="grid"><div class="muted">Loading…</div></section></main><script>
const root=document.getElementById('items'),message=document.getElementById('message');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/library',{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401){message.innerHTML='<p class="error">Please log in to view your library.</p>';root.innerHTML='';return}if(!r.ok)throw Error(d.error?.message||d.error||'Unable to load library');const items=d.items||[];if(!items.length){root.innerHTML='<div class="empty muted">You have no purchased videos yet.</div>';return}root.innerHTML=items.map(i=>`<article class="card"><h2>${esc(i.title||'Untitled')}</h2><p class="muted">Purchased ${esc(i.purchased_at||'')}</p><p>${esc(i.description||'')}</p><div class="actions">${i.streaming_enabled!==false?`<a class="btn primary" href="/api/media/${encodeURIComponent(i.product_id)}/stream" target="_blank" rel="noopener">Watch</a>`:''}${i.download_enabled!==false?`<a class="btn" href="/api/media/${encodeURIComponent(i.product_id)}/download">Download</a>`:''}</div></article>`).join('')}catch(e){message.innerHTML='<p class="error">'+esc(e.message)+'</p>';root.innerHTML='' }}load();
</script></body></html>
