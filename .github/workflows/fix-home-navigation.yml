name: Fix homepage navigation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.pull_request.head.sha, '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only homepage navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<a class="system" href="#" onclick="event.preventDefault()">\n          >販売者デモ</a\n        ><a class="system" href="#" onclick="event.preventDefault()">\n          >購入者デモ</a>'''
          new = '''<a class="system" href="/pages/creator-studio.html">\n          >販売者デモ</a\n        ><a class="system" href="/pages/account.html">\n          >購入者デモ</a>'''
          if old not in s:
              raise SystemExit('seller/buyer navigation pattern not found')
          s = s.replace(old, new, 1)
          old2 = '''<button type="button" onclick="event.preventDefault()">\n              販売者ログイン</button>\n            ><button type="button" onclick="event.preventDefault()">\n              購入者ログイン\n            </button>'''
          new2 = '''<button type="button" onclick="location.href='/pages/login.html?role=seller'">\n              販売者ログイン</button>\n            ><button type="button" onclick="location.href='/pages/login.html?role=buyer'">\n              購入者ログイン\n            </button>'''
          if old2 not in s:
              raise SystemExit('login navigation pattern not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit exact navigation fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-home-navigation.yml
          git add demo/index.html
          git commit -m 'fix: restore homepage demo and login navigation'
          git push
