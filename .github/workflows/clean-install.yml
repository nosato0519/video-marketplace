name: Clean Install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      SESSION_SECRET: clean-install-test-secret-at-least-32-bytes-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Migration preflight
        run: npm run migrate:preflight
      - name: Run migrations
        run: npm run migrate
      - name: Verify migration state
        run: node -e "import('./src/db.js').then(async ({query})=>{const r=await query('SELECT version,status FROM schema_migrations ORDER BY version'); console.log(JSON.stringify(r.rows,null,2)); if(!r.rows.length) process.exit(1);})"
      - name: Run core regression tests
        run: npm test
