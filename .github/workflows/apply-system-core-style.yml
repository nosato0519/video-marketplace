name: Apply System Core Style
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Emphasize system core headline' && github.event.head_commit.message != 'Apply system core panel style'
    steps:
      - uses: actions/checkout@v4
      - name: Append premium section styling
        run: |
          cat >> demo/ott-home-v3.css <<'EOF'
          #guide>div[style*="rgba(255,255,255,.12)"]{position:relative;overflow:hidden;margin-top:34px!important;padding:40px 44px 38px!important;border:1px solid rgba(217,180,95,.34)!important;border-radius:22px!important;background:radial-gradient(circle at 88% 12%,rgba(217,180,95,.18),transparent 30%),radial-gradient(circle at 8% 100%,rgba(217,180,95,.07),transparent 35%),linear-gradient(120deg,rgba(217,180,95,.085),rgba(255,255,255,.03) 45%,rgba(255,255,255,.018))!important;box-shadow:0 28px 85px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.09)}#guide>div[style*="rgba(255,255,255,.12)"]:before{content:"SYSTEM CORE";position:absolute;right:30px;top:24px;font-size:8px;letter-spacing:2.8px;font-weight:900;color:rgba(217,180,95,.82);padding:8px 12px;border:1px solid rgba(217,180,95,.34);border-radius:999px;background:rgba(7,9,13,.52);box-shadow:0 8px 28px rgba(0,0,0,.22)}#guide>div[style*="rgba(255,255,255,.12)"]:after{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,transparent,#f0d78b,var(--accent),#f0d78b,transparent);box-shadow:0 0 30px rgba(217,180,95,.5)}#guide>div[style*="rgba(255,255,255,.12)"] strong{display:flex!important;align-items:flex-start;gap:15px;margin-bottom:18px!important;font-size:0!important;line-height:1.08!important;letter-spacing:-1px!important;color:#fff!important;position:relative;z-index:1}#guide>div[style*="rgba(255,255,255,.12)"] strong:after{content:"必要な仕組みを、\\A 最初から。";white-space:pre;display:block;font-size:29px;line-height:1.2;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#fff 0%,#fff 54%,#f0d78b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 35px rgba(217,180,95,.12)}#guide>div[style*="rgba(255,255,255,.12)"] strong:before{content:"✦";display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;margin-top:2px;border-radius:11px;color:#0b0d10;background:linear-gradient(135deg,#f5df9a,var(--accent));box-shadow:0 10px 30px rgba(217,180,95,.3),0 0 0 1px rgba(255,255,255,.1) inset;font-size:17px}#guide>div[style*="rgba(255,255,255,.12)"] p{max-width:920px!important;margin:0!important;color:#b8c0c9;line-height:2!important;font-size:11.5px!important;position:relative;z-index:1}#guide>div[style*="rgba(255,255,255,.12)"]:hover{border-color:rgba(217,180,95,.5)!important;transform:translateY(-3px);transition:.3s ease;box-shadow:0 34px 95px rgba(0,0,0,.43),inset 0 1px 0 rgba(255,255,255,.1)}
          #features .roles .role,#features>div:not(.section-head)>article.role{min-height:250px;padding:28px 27px 24px!important;border:0!important;border-radius:16px!important;background:linear-gradient(145deg,rgba(20,26,34,.96),rgba(10,14,20,.98))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 18px 48px rgba(0,0,0,.22);position:relative;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease,background .3s ease!important}#features .roles .role:before,#features>div:not(.section-head)>article.role:before{content:"";position:absolute;inset:0;width:auto;height:auto;border-radius:0;background:linear-gradient(135deg,rgba(217,180,95,.11),transparent 34%,transparent 72%,rgba(139,215,255,.045));opacity:.9;pointer-events:none}#features .roles .role:after,#features>div:not(.section-head)>article.role:after{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}#features .roles .role:hover,#features>div:not(.section-head)>article.role:hover{transform:translateY(-6px)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 28px 65px rgba(0,0,0,.36)}#features .role .num{display:inline-flex!important;align-items:center;gap:8px;font-size:8px!important;letter-spacing:2.2px!important;font-weight:900;position:relative;z-index:2}#features .role .num:after{content:"";width:28px;height:1px;background:var(--accent);opacity:.65}#features .role h3{font-size:23px!important;line-height:1.15!important;letter-spacing:-.8px!important;margin:22px 0 13px!important;position:relative;z-index:2}#features .role p{position:relative;z-index:2;color:#8995a2!important;line-height:1.85!important}#features .role .tags{position:relative;z-index:2;gap:6px!important;margin-top:18px!important}#features .role .tags span{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.10)!important;border-radius:7px!important;padding:6px 8px!important;font-size:8px!important;transition:.2s ease}#features .role:hover .tags span{border-color:rgba(217,180,95,.20)!important;background:rgba(217,180,95,.045)}#features>div[style*="repeat(3,minmax(0,1fr))"]>article:nth-child(1){background:linear-gradient(145deg,rgba(22,27,34,.98),rgba(9,13,19,.98))!important}#features>div[style*="repeat(3,minmax(0,1fr))"]>article:nth-child(2){background:linear-gradient(145deg,rgba(17,27,34,.98),rgba(8,14,19,.98))!important}#features>div[style*="repeat(3,minmax(0,1fr))"]>article:nth-child(3){background:linear-gradient(145deg,rgba(24,25,31,.98),rgba(10,12,17,.98))!important}@media(max-width:760px){#guide>div[style*="rgba(255,255,255,.12)"]{padding:32px 26px 30px!important;border-radius:18px!important}#guide>div[style*="rgba(255,255,255,.12)"]:before{right:20px;top:18px;font-size:7px}#guide>div[style*="rgba(255,255,255,.12)"] strong{gap:11px;padding-right:70px}#guide>div[style*="rgba(255,255,255,.12)"] strong:after{font-size:22px}#guide>div[style*="rgba(255,255,255,.12)"] strong:before{width:32px;height:32px;border-radius:9px;font-size:14px}#guide>div[style*="rgba(255,255,255,.12)"] p{font-size:10.5px!important;line-height:1.9!important}#features .roles .role,#features>div:not(.section-head)>article.role{min-height:220px;padding:24px 22px 21px!important}}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/ott-home-v3.css
          git commit -m "Apply feature showcase card design"
          git push
