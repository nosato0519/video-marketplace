name: Apply System Core Style
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Emphasize system core headline' && github.event.head_commit.message != 'Apply system core panel style'
    steps:
      - uses: actions/checkout@v4
      - name: Append system core styling
        run: |
          cat >> demo/ott-home-v3.css <<'EOF'
          #guide>div[style*="rgba(255,255,255,.12)"]{position:relative;overflow:hidden;margin-top:34px!important;padding:40px 44px 38px!important;border:1px solid rgba(217,180,95,.34)!important;border-radius:22px!important;background:radial-gradient(circle at 88% 12%,rgba(217,180,95,.18),transparent 30%),radial-gradient(circle at 8% 100%,rgba(217,180,95,.07),transparent 35%),linear-gradient(120deg,rgba(217,180,95,.085),rgba(255,255,255,.03) 45%,rgba(255,255,255,.018))!important;box-shadow:0 28px 85px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.09)}#guide>div[style*="rgba(255,255,255,.12)"]:before{content:"SYSTEM CORE";position:absolute;right:30px;top:24px;font-size:8px;letter-spacing:2.8px;font-weight:900;color:rgba(217,180,95,.82);padding:8px 12px;border:1px solid rgba(217,180,95,.34);border-radius:999px;background:rgba(7,9,13,.52);box-shadow:0 8px 28px rgba(0,0,0,.22)}#guide>div[style*="rgba(255,255,255,.12)"]:after{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,transparent,#f0d78b,var(--accent),#f0d78b,transparent);box-shadow:0 0 30px rgba(217,180,95,.5)}#guide>div[style*="rgba(255,255,255,.12)"] strong{display:flex!important;align-items:flex-start;gap:15px;margin-bottom:18px!important;font-size:0!important;line-height:1.08!important;letter-spacing:-1px!important;color:#fff!important;position:relative;z-index:1}#guide>div[style*="rgba(255,255,255,.12)"] strong:after{content:"必要な仕組みを、\\A 最初から。";white-space:pre;display:block;font-size:29px;line-height:1.2;font-weight:900;letter-spacing:-1.2px;background:linear-gradient(90deg,#fff 0%,#fff 54%,#f0d78b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 35px rgba(217,180,95,.12)}#guide>div[style*="rgba(255,255,255,.12)"] strong:before{content:"✦";display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;margin-top:2px;border-radius:11px;color:#0b0d10;background:linear-gradient(135deg,#f5df9a,var(--accent));box-shadow:0 10px 30px rgba(217,180,95,.3),0 0 0 1px rgba(255,255,255,.1) inset;font-size:17px}#guide>div[style*="rgba(255,255,255,.12)"] p{max-width:920px!important;margin:0!important;color:#b8c0c9;line-height:2!important;font-size:11.5px!important;position:relative;z-index:1}#guide>div[style*="rgba(255,255,255,.12)"]:hover{border-color:rgba(217,180,95,.5)!important;transform:translateY(-3px);transition:.3s ease;box-shadow:0 34px 95px rgba(0,0,0,.43),inset 0 1px 0 rgba(255,255,255,.1)}@media(max-width:760px){#guide>div[style*="rgba(255,255,255,.12)"]{padding:32px 26px 30px!important;border-radius:18px!important}#guide>div[style*="rgba(255,255,255,.12)"]:before{right:20px;top:18px;font-size:7px}#guide>div[style*="rgba(255,255,255,.12)"] strong{gap:11px;padding-right:70px}#guide>div[style*="rgba(255,255,255,.12)"] strong:after{font-size:22px}#guide>div[style*="rgba(255,255,255,.12)"] strong:before{width:32px;height:32px;border-radius:9px;font-size:14px}#guide>div[style*="rgba(255,255,255,.12)"] p{font-size:10.5px!important;line-height:1.9!important}}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/ott-home-v3.css
          git commit -m "Apply system core panel style"
          git push
