name: Apply System Core Style
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Emphasize system core headline' && github.event.head_commit.message != 'Apply system core panel style' && github.event.head_commit.message != 'Apply feature showcase card design'
    steps:
      - uses: actions/checkout@v4
      - name: Append premium section styling
        run: |
          cat >> demo/ott-home-v3.css <<'EOF'
          /* Luxury READY TO OPERATE / BUILT TO CUSTOMIZE panel */
          #customize>div{position:relative!important;overflow:hidden!important;padding:58px 52px 50px!important;border:1px solid rgba(217,180,95,.26)!important;border-radius:26px!important;background:radial-gradient(circle at 92% 8%,rgba(217,180,95,.16),transparent 28%),radial-gradient(circle at 5% 100%,rgba(139,215,255,.035),transparent 30%),linear-gradient(135deg,rgba(27,27,28,.98),rgba(10,12,15,.99) 52%,rgba(18,16,12,.98))!important;box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.7)!important}
          #customize>div:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 22%,transparent 70%,rgba(217,180,95,.055));}
          #customize>div:after{content:"";position:absolute;top:18px;right:18px;width:86px;height:86px;border-top:1px solid rgba(217,180,95,.42);border-right:1px solid rgba(217,180,95,.42);opacity:.7;pointer-events:none}
          #customize .section-kicker{position:relative!important;z-index:2!important;display:inline-flex!important;align-items:center!important;gap:12px!important;padding:8px 13px!important;border:1px solid rgba(217,180,95,.25)!important;border-radius:999px!important;background:rgba(217,180,95,.045)!important;color:#d9b45f!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important}
          #customize .section-kicker:before{content:"✦";font-size:9px;color:#f0d78b}
          #customize h2{position:relative!important;z-index:2!important;margin:22px 0 0!important;font-size:38px!important;line-height:1.14!important;letter-spacing:-1.8px!important;color:#fbfbfa!important;text-shadow:0 10px 35px rgba(0,0,0,.35)}
          #customize h2 em{background:linear-gradient(90deg,#fff 0%,#fff 42%,#f0d78b 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
          #customize p{position:relative!important;z-index:2!important;color:#aeb5bd!important}
          #customize .tags{position:relative!important;z-index:2!important;display:flex;flex-wrap:wrap;gap:8px!important}
          #customize .tags span{padding:8px 12px!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:999px!important;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.018))!important;color:#cbd0d5!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)!important;transition:.3s ease!important}
          #customize .tags span:hover{border-color:rgba(217,180,95,.32)!important;background:rgba(217,180,95,.07)!important;color:#eadfbf!important;transform:translateY(-2px)}
          @media(max-width:760px){#customize>div{padding:40px 24px 34px!important;border-radius:20px!important}#customize>div:after{width:55px;height:55px;top:14px;right:14px}#customize h2{font-size:29px!important;letter-spacing:-1.1px!important;margin-top:18px!important}#customize .section-kicker{font-size:7px!important;padding:7px 10px!important}#customize .tags span{font-size:8px!important;padding:7px 10px!important}}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/ott-home-v3.css
          git commit -m "Apply feature showcase card design"
          git push
