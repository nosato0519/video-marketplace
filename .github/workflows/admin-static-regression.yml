name: Admin Static Regression

on:
  push:
    paths:
      - 'admin/**'
      - 'app/admin/**'
      - 'tests/admin-static-entrypoint.test.js'
      - '.github/workflows/admin-static-regression.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'app/admin/**'
      - 'tests/admin-static-entrypoint.test.js'
      - '.github/workflows/admin-static-regression.yml'

jobs:
  admin-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Admin static entrypoint contract test
        run: node tests/admin-static-entrypoint.test.js
