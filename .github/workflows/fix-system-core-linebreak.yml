name: Fix System Core Headline
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix headline rendering and remove temporary workflow
        run: |
          cat >> demo/ott-home-v3.css <<'EOF'
          #guide>div[style*="rgba(255,255,255,.12)"] strong:after{content:"必要な仕組みを、最初から。"!important;white-space:nowrap!important}
          @media(max-width:760px){#guide>div[style*="rgba(255,255,255,.12)"] strong:after{white-space:normal!important}}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/ott-home-v3.css .github/workflows/fix-system-core-linebreak.yml
          git commit -m "Fix system core headline line break"
          git rm .github/workflows/fix-system-core-linebreak.yml
          git commit -m "Remove temporary headline fix workflow"
          git push
