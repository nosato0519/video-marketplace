name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace_test
      SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_DIR: ${{ github.workspace }}/backend/media-data
      MEDIA_URL_SECRET: ci-media-url-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      PAYMENT_WEBHOOK_SECRET: ci-payment-webhook-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      NODE_ENV: test
      PORT: 3000
      BROWSER_BACKEND_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend migrations
        working-directory: backend
        run: npm run migrate

      - name: Start backend API
        working-directory: backend
        run: nohup npm run start > /tmp/video-marketplace-api.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/video-marketplace-api.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-backend Buyer browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/app/index.html
          BROWSER_BACKEND_URL: http://127.0.0.1:3000
        run: npx playwright test tests/browser-buyer-real-backend.spec.js tests/browser-module-smoke.spec.js --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/video-marketplace-api.log
          if-no-files-found: ignore
