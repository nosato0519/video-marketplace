name: Security Regression

on:
  push:
    paths:
      - 'backend/src/security/**'
      - '.github/workflows/security-regression.yml'
  pull_request:
    paths:
      - 'backend/src/security/**'
      - '.github/workflows/security-regression.yml'
  workflow_dispatch:

# Manual dispatch is available; this workflow also runs automatically when security code or this workflow changes.
jobs:
  security-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:security-regression
