name: Browser Smoke

on:
  push:
    paths:
      - 'app/**'
      - 'tests/browser-smoke.spec.js'
      - 'tests/browser-seller-application.spec.js'
      - 'tests/browser-module-smoke.spec.js'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/browser-smoke.spec.js'
      - 'tests/browser-seller-application.spec.js'
      - 'tests/browser-module-smoke.spec.js'
      - '.github/workflows/browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static application server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/video-market-browser.log 2>&1 &
      - name: Run browser module smoke diagnostics
        run: npx playwright test tests/browser-module-smoke.spec.js --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/app/index.html
      - name: Run browser smoke tests
        run: npx playwright test tests/browser-smoke.spec.js tests/browser-seller-application.spec.js --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/app/index.html
