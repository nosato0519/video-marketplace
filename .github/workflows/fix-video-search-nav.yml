name: Fix video search navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix video search navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation target
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<nav><a href="#guide">機能・システム</a><a href="#popular">人気の動画</a><a href="#videos">動画を探す</a><a href="#creators">クリエイター</a></nav>'
          new = '<nav><a href="#guide">機能・システム</a><a href="#popular">人気の動画</a><a href="#search">動画を探す</a><a href="#creators">クリエイター</a></nav>'
          if old not in s:
              raise SystemExit('target navigation not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-video-search-nav.yml
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/index.html
          git commit -m 'Fix video search navigation'
          git push
