name: Seller Product Flow Static Regression

on:
  push:
    paths:
      - 'backend/src/app.js'
      - 'backend/src/catalog.js'
      - 'backend/src/catalog/product-detail-policy.js'
      - 'backend/src/catalog/product-detail-routes.js'
      - 'backend/src/admin/content-moderation-routes.js'
      - 'backend/src/media/media-upload-route.js'
      - 'backend/src/media/s3-media-storage.js'
      - 'backend/src/seller/product-routes.js'
      - 'backend/migrations/029_seed_product_categories.sql'
      - 'backend/migrations/030_product_images.sql'
      - 'backend/migrations/031_publish_approved_products.sql'
      - 'app/catalog/published-listings.js'
      - 'app/seller/seller-products.js'
      - 'app/seller/seller-upload.js'
      - 'pages/admin-seller-videos.html'
      - 'pages/product-detail.html'
      - 'seller/products.html'
      - 'seller/product-editor.html'
      - 'seller/product-editor.js'
      - 'seller/product-edit.html'
      - 'tests/seller-product-flow-static.test.js'
      - '.github/workflows/seller-product-flow-static-regression.yml'
  pull_request:
    paths:
      - 'backend/src/app.js'
      - 'backend/src/catalog.js'
      - 'backend/src/catalog/product-detail-policy.js'
      - 'backend/src/catalog/product-detail-routes.js'
      - 'backend/src/admin/content-moderation-routes.js'
      - 'backend/src/media/media-upload-route.js'
      - 'backend/src/media/s3-media-storage.js'
      - 'backend/src/seller/product-routes.js'
      - 'backend/migrations/029_seed_product_categories.sql'
      - 'backend/migrations/030_product_images.sql'
      - 'backend/migrations/031_publish_approved_products.sql'
      - 'app/catalog/published-listings.js'
      - 'app/seller/seller-products.js'
      - 'app/seller/seller-upload.js'
      - 'pages/admin-seller-videos.html'
      - 'pages/product-detail.html'
      - 'seller/products.html'
      - 'seller/product-editor.html'
      - 'seller/product-editor.js'
      - 'seller/product-edit.html'
      - 'tests/seller-product-flow-static.test.js'
      - '.github/workflows/seller-product-flow-static-regression.yml'

jobs:
  seller-product-flow-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Seller product flow static contract test
        run: node tests/seller-product-flow-static.test.js
