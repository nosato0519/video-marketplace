name: Backend Regression

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate:preflight
      - run: npm test
      - name: Run media authorization regression
        run: node --test src/media/protected-access.test.js
      - name: Run media upload validation regression
        run: node --test src/media/media-upload-validation.test.js
