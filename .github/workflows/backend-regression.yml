name: Backend Regression

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: video_marketplace_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_marketplace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/video_marketplace_test
      NODE_ENV: test
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_DIR: ./media-data
      MEDIA_URL_SECRET: ci-test-media-url-secret-not-for-production
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-test-payment-webhook-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate:preflight
      - run: npm run migrate
      - name: Run backup and restore round-trip acceptance
        run: npm run test:backup-restore-acceptance
      - run: npm test
      - name: Run authentication HTTP acceptance
        run: npm run test:http-auth
      - name: Run payment webhook acceptance
        run: npm run test:http-payment-webhook
      - name: Run payment failure acceptance
        run: npm run test:http-payment-failed
      - name: Run payment refund acceptance
        run: npm run test:http-payment-refund
      - name: Run buyer purchase E2E
        run: npm run test:http-buyer-purchase-e2e
      - name: Run seller product media E2E
        run: npm run test:http-seller-product-media-e2e
      - name: Run seller earnings and payout E2E
        run: npm run test:http-seller-profile-earnings-payout-e2e
      - name: Run admin payout concurrency regression
        run: npm run test:admin-payout-concurrency-regression
      - name: Run media authorization regression
        run: node --test src/media/protected-access.test.js
      - name: Run media upload validation regression
        run: node --test src/media/media-upload-validation.test.js
      - name: Run media access HTTP acceptance
        run: npm run test:http-media-access-e2e
