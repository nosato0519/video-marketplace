name: Fix seller product edit route
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-product-edit-route.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add product edit route to force-page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('demo/force-page.mjs')
          s=p.read_text()
          old="'/pages/sales-history.html']);"
          new="'/pages/sales-history.html','/pages/product-edit.html']);"
          if "'/pages/product-edit.html'" not in s:
              if old not in s:
                  raise SystemExit('allowed route boundary not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/force-page.mjs
          git diff --cached --quiet || git commit -m 'fix: allow seller product edit page route'
          git push
