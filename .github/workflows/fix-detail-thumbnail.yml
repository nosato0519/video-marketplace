name: Fix detail thumbnail matching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and detail preview
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('demo')
          old = "go(routes.detail + '?product=' + productIdForCard(el));"
          new = """go(routes.detail + '?product=' + productIdForCard(el) + '&thumb=' + encodeURIComponent((() => { const card = el.closest('.card,.video-card,.video-item,[data-video-id],.mini,.mosaic-card'); const thumb = card?.querySelector('.thumb,.showcase-bg,.pic,.recommendation-thumb'); if (!thumb) return ''; const bg = getComputedStyle(thumb).backgroundImage; const m = bg.match(/url\\((?:\\\"|')?(.+?)(?:\\\"|')?\\)/); return m ? m[1] : ''; })()));"""

          changed = []
          for path in root.rglob('*.mjs'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text2 = text.replace(old, new)
                  path.write_text(text2, encoding='utf-8')
                  changed.append(str(path))

          detail = root / 'pages' / 'product-detail.html'
          text = detail.read_text(encoding='utf-8')
          marker = "const id=new URLSearchParams(location.search).get('product')||'1';const p=products[id]||products[1];"
          replacement = "const params=new URLSearchParams(location.search);const id=params.get('product')||'1';const p=products[id]||products[1];const passedThumb=params.get('thumb')||'';"
          if marker in text:
              text = text.replace(marker, replacement, 1)
              old_visual = "visual.style.backgroundImage=`linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72)),url('${thumbnailUrls[id]||thumbnailUrls[1]}')`;"
              new_visual = "visual.style.backgroundImage=`linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72)),url('${passedThumb||thumbnailUrls[id]||thumbnailUrls[1]}')`;"
              text = text.replace(old_visual, new_visual, 1)
              detail.write_text(text, encoding='utf-8')
              changed.append(str(detail))

          if not changed:
              print('No matching source changes found; nothing to commit.')
          else:
              print('Changed:', *changed, sep='\\n- ')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo
          git diff --cached --quiet && exit 0
          git commit -m 'fix: match product detail preview to clicked thumbnail'
          git push
