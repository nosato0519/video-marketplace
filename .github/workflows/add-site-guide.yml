name: Add site guide to top navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refine demo system feature guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('demo/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('<a href="#library">購入済み</a><a href="#guide">ご利用ガイド</a></nav>', '<a href="#library">購入済み</a><a href="#guide">機能・システム</a></nav>', 1)
          text = text.replace('<a href="#library">購入済み</a></nav>', '<a href="#library">購入済み</a><a href="#guide">機能・システム</a></nav>', 1)

          marker = '</main><footer>'
          guide = '''<section class="section" id="guide" style="scroll-margin-top:100px;padding-top:96px;padding-bottom:96px"><div class="section-head"><div><span class="section-kicker">COMPLETE VIDEO MARKETPLACE SYSTEM</span><h2>動画販売に必要なすべてを、<br><em>ひとつのシステムに。</em></h2></div></div><p style="max-width:860px;margin:0 0 42px;line-height:2;font-size:1.05rem;opacity:.82">販売者・購入者・運営者。それぞれに必要な機能をひとつにまとめた、動画販売マーケットプレイスシステムです。動画の登録・販売、会員登録・購入、決済、購入後の視聴、売上管理、サイト運営まで、一連の流れをシステム内で完結できます。</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px"><article class="role"><span class="num">01 / SELLER</span><h3>販売者は、動画を販売。</h3><p>販売者はアカウントを登録し、動画・商品を登録して販売できます。販売状況や売上も管理できます。</p><div class="tags"><span>会員登録</span><span>商品登録</span><span>動画販売</span><span>売上管理</span></div></article><article class="role creator-role"><span class="num">02 / BUYER</span><h3>購入者は、動画を購入。</h3><p>購入者は会員登録後、動画を探して購入。購入した作品はマイライブラリから視聴・ダウンロードできます。</p><div class="tags"><span>会員登録</span><span>検索</span><span>購入・決済</span><span>視聴・DL</span></div></article><article class="role admin-role"><span class="num">03 / ADMIN</span><h3>あなたは、そのサイトを運営。</h3><p>運営者は管理画面からユーザー、販売者、商品、動画、注文、決済、売上、出金などを一元管理できます。</p><div class="tags"><span>ユーザー管理</span><span>商品管理</span><span>決済管理</span><span>運営管理</span></div></article></div><div style="margin-top:28px;padding:28px 30px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.035)"><strong style="display:block;margin-bottom:10px">必要な仕組みを、最初から。</strong><p style="margin:0;line-height:1.9;opacity:.8">販売者が動画を販売し、購入者が動画を購入する。そのマーケットプレイス全体を、あなたが運営する。会員・権限管理、商品・動画管理、購入・決済、購入者ごとの利用権限、保護された動画配信、売上・出金管理、管理者機能など、動画販売サイトの運営に必要となる主要な仕組みをまとめています。</p></div></section>'''

          pattern = r'<section class="section" id="guide".*?</section>'
          if re.search(pattern, text):
              text = re.sub(pattern, guide, text, count=1, flags=re.S)
          elif marker in text:
              text = text.replace(marker, guide + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          git diff --cached --quiet || git commit -m "Apply demo system feature guide"
          git push
