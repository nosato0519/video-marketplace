name: Disable login menu navigation
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make login dropdown non-navigating
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button type="button">販売者ログイン</button><button type="button">購入者ログイン</button>', '<button type="button" onclick="event.preventDefault()">販売者ログイン</button><button type="button" onclick="event.preventDefault()">購入者ログイン</button>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          git commit -m "Disable login dropdown navigation" || exit 0
          git push
      - name: Remove this workflow
        if: always()
        run: |
          rm -f .github/workflows/disable-login-navigation.yml
          git add .github/workflows/disable-login-navigation.yml
          git commit -m "Remove one-time login navigation workflow" || exit 0
          git push
