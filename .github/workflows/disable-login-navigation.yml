name: Disable demo navigation
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Disable only demo navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<a class="system" href="#creator">販売者デモ</a>', '<a class="system" href="#" onclick="event.preventDefault()">販売者デモ</a>')
          s = s.replace('<a class="system" href="#popular">購入者デモ</a>', '<a class="system" href="#" onclick="event.preventDefault()">購入者デモ</a>')
          s = s.replace('<button type="button">販売者ログイン</button><button type="button">購入者ログイン</button>', '<button type="button" onclick="event.preventDefault()">販売者ログイン</button><button type="button" onclick="event.preventDefault()">購入者ログイン</button>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          git commit -m "Disable demo navigation" || exit 0
          git push
      - name: Remove this workflow and trigger
        if: always()
        run: |
          rm -f .github/workflows/disable-login-navigation.yml .github/demo-nav-trigger.txt .github/demo-nav-trigger-2.txt
          git add -A
          git commit -m "Remove temporary demo navigation workflow" || exit 0
          git push
