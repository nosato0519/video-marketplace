name: Browser UI Acceptance

on:
  push:
    branches: [main, feat/buyer-browser-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-ui-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace
      NODE_ENV: test
      PORT: 3000
      SESSION_SECRET: acceptance-only-session-secret-0123456789abcdef
      MEDIA_STORAGE_PROVIDER: local
      MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: acceptance-only-payment-webhook-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate database
        working-directory: backend
        run: npm run migrate:preflight && npm run migrate
      - name: Start backend
        working-directory: backend
        run: npm start > /tmp/video-marketplace-backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/video-marketplace-backend.log
          exit 1
      - name: Run real-backend buyer browser acceptance
        run: npx playwright test tests/browser-buyer-real-backend.spec.js --reporter=line
      - name: Run browser module smoke
        run: npx playwright test tests/browser-module-smoke.spec.js --reporter=line
