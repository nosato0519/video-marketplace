name: Browser UI Acceptance

on:
  push:
    branches: [feat/buyer-browser-e2e, production/top-clean]
  pull_request:
    branches: [production/top-clean]
  workflow_dispatch:

concurrency:
  group: browser-ui-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run buyer browser acceptance
        run: npx playwright test tests/browser-buyer-purchase.spec.js --reporter=line
      - name: Run browser module smoke
        run: npx playwright test tests/browser-module-smoke.spec.js --reporter=line
