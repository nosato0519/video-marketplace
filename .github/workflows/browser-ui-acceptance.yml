name: Browser UI Acceptance

on:
  push:
    branches: [main, feat/buyer-browser-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-ui-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run buyer browser acceptance
        run: npx playwright test tests/browser-buyer-purchase.spec.js --reporter=line
      - name: Run browser module smoke
        run: npx playwright test tests/browser-module-smoke.spec.js --reporter=line
      - name: Capture rendered showcase evidence
        run: npx playwright test tests/browser-visual-evidence.spec.js --reporter=line
      - name: Upload rendered showcase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-showcase-evidence
          path: tests/artifacts/
          if-no-files-found: warn
