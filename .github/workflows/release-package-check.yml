name: Release Package Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-package-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify release package safety
        run: npm run release:check

      - name: Build release archive
        run: npm run release:package

      - name: Verify archive integrity and contents
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/vidora-commercial.zip
          unzip -t dist/vidora-commercial.zip
          unzip -Z1 dist/vidora-commercial.zip | grep -qx 'vidora-commercial/package.json'
          unzip -Z1 dist/vidora-commercial.zip | grep -qx 'vidora-commercial/README.md'
          unzip -Z1 dist/vidora-commercial.zip | grep -qx 'vidora-commercial/RELEASE_MANIFEST.txt'
          if unzip -Z1 dist/vidora-commercial.zip | grep -E '(^|/)(\.env(\.|$)|node_modules|dist|\.git|\.DS_Store)(/|$)'; then
            echo 'Forbidden release path detected'
            exit 1
          fi
          if unzip -Z1 dist/vidora-commercial.zip | grep -Ei '\.(pem|key|p12|pfx)$'; then
            echo 'Credential/key file detected'
            exit 1
          fi

      - name: Upload release-package artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidora-commercial-package
          path: dist/vidora-commercial.zip
          if-no-files-found: error
