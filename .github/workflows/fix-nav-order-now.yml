name: Fix top navigation order now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nav:
    if: ${{ !contains(github.event.head_commit.message, 'Fix top navigation order') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<nav><a href="#videos">動画を探す</a><a href="#popular">人気の動画</a><a href="#guide">機能・システム</a><a href="#creators">クリエイター</a></nav>'
          new = '<nav><a href="#guide">機能・システム</a><a href="#popular">人気の動画</a><a href="#videos">動画を探す</a><a href="#creators">クリエイター</a></nav>'
          if old not in s:
              raise SystemExit('Expected navigation markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify navigation order
        run: |
          grep -o '<nav>.*</nav>' demo/index.html | head -1
          grep -q '<nav><a href="#guide">機能・システム</a><a href="#popular">人気の動画</a><a href="#videos">動画を探す</a><a href="#creators">クリエイター</a></nav>' demo/index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/index.html
          git commit -m 'Fix top navigation order'
          git push
