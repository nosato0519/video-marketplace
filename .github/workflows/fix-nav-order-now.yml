name: Fix top navigation order now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nav:
    if: ${{ !contains(github.event.head_commit.message, 'Fix top navigation order') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="nav-right"><a class="system" href="#guide">システムを見る</a><a class="sell" href="#creator">ログイン</a></div>'
          new = '<div class="nav-right"><a class="system" href="#creator">販売者デモ</a><a class="system" href="#popular">購入者デモ</a><a class="sell" href="#creator">ログイン</a></div>'
          if old not in s:
              raise SystemExit('Expected header navigation markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify navigation
        run: |
          grep -q '<div class="nav-right"><a class="system" href="#creator">販売者デモ</a><a class="system" href="#popular">購入者デモ</a><a class="sell" href="#creator">ログイン</a></div>' demo/index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/index.html
          git commit -m 'Fix top navigation order'
          git push
