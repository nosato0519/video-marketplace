name: Backend Browser Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Run the real backend acceptance suite and browser acceptance test against the current main/PR state.
# E2E uses CI-only media/payment security configuration.
jobs:
  backend-browser-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d video_marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser test dependencies
        run: npm install
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace
        run: npm run migrate
      - name: Run backend acceptance suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace
          NODE_ENV: test
          MEDIA_URL_SECRET: ci-test-media-url-secret-0123456789abcdef0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
          MEDIA_STORAGE_PROVIDER: local
          PAYMENT_WEBHOOK_SECRET: ci-test-payment-webhook-secret-0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_STORAGE_DIR"
          npm run test:rate-limit
          npm run test:http-auth
          npm run test:http-seller-application
          npm run test:http-seller-product-media-e2e
          npm run test:http-buyer-purchase-e2e
          npm run test:http-media-access-e2e
          npm run test:http-payment-webhook
          npm run test:http-payment-refund
          npm run test:http-payment-failed
          npm run test:security-regression
      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace
          PORT: 3000
          NODE_ENV: test
          MEDIA_URL_SECRET: ci-test-media-url-secret-0123456789abcdef0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
          MEDIA_STORAGE_PROVIDER: local
          PAYMENT_WEBHOOK_SECRET: ci-test-payment-webhook-secret-0123456789abcdef0123456789abcdef
        run: mkdir -p "$MEDIA_STORAGE_DIR" && node src/server.js > /tmp/video-marketplace-api.log 2>&1 &
      - name: Wait for backend
        run: node -e "const http=require('http');let n=0;const t=setInterval(()=>{const r=http.get('http://127.0.0.1:3000/api/health',x=>{if(x.statusCode===200){clearInterval(t);process.exit(0)}});r.on('error',()=>{});if(++n>60){clearInterval(t);process.exit(1)}},1000)"
      - name: Start browser proxy
        env:
          BROWSER_SERVER_PORT: 4173
          BROWSER_BACKEND_URL: http://127.0.0.1:3000
        run: node tests/browser-server.js > /tmp/video-marketplace-browser.log 2>&1 &
      - name: Wait for browser proxy
        run: node -e "const http=require('http');let n=0;const t=setInterval(()=>{const r=http.get('http://127.0.0.1:4173/app/index.html',x=>{if(x.statusCode===200){clearInterval(t);process.exit(0)}});r.on('error',()=>{});if(++n>30){clearInterval(t);process.exit(1)}},500)"
      - name: Run real backend browser acceptance
        env:
          BACKEND_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/video_marketplace
          NODE_ENV: test
          MEDIA_URL_SECRET: ci-test-media-url-secret-0123456789abcdef0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
          MEDIA_STORAGE_PROVIDER: local
          PAYMENT_WEBHOOK_SECRET: ci-test-payment-webhook-secret-0123456789abcdef0123456789abcdef
        run: npx playwright test tests/browser-backend-seller-application.spec.js tests/browser-backend-buyer-purchase.spec.js --reporter=line
      - name: Dump backend logs on failure
        if: failure()
        run: |
          cat /tmp/video-marketplace-api.log || true
          cat /tmp/video-marketplace-browser.log || true
