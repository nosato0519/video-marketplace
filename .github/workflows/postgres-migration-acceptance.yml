name: postgres-migration-acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/migrations/**'
      - 'backend/src/**'
      - 'backend/scripts/**'
      - 'backend/package.json'
      - '.github/workflows/postgres-migration-acceptance.yml'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U marketplace -d marketplace_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run migrate:preflight
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run migration:plan
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run test:commerce-db
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run test:moderation-db
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
      - run: npm run test:moderation-http
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      - run: npm run test:migration-concurrency
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          MIGRATION_CONCURRENCY_RUNNERS: 4
      - run: npm run test:legacy-purchase-migration
        env:
          LEGACY_DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_legacy_test
      - run: npm run test:http-payment-webhook
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          PAYMENT_WEBHOOK_SECRET: acceptance-only-payment-webhook-secret-0123456789abcdef
      - run: npm run test:http-payment-refund
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          PAYMENT_WEBHOOK_SECRET: acceptance-only-payment-webhook-secret-0123456789abcdef
      - run: npm run test:http-payment-failed
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          PAYMENT_WEBHOOK_SECRET: acceptance-only-payment-webhook-secret-0123456789abcdef
      - run: npm run test:http-buyer-purchase-e2e
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          PAYMENT_WEBHOOK_SECRET: acceptance-only-payment-webhook-secret-0123456789abcdef
          MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      - run: npm run test:http-buyer-order-report-e2e
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      - run: npm run test:http-seller-product-media-e2e
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      - run: npm run test:http-seller-profile-earnings-payout-e2e
        env:
          DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_test
          MEDIA_URL_SECRET: acceptance-only-media-url-secret-0123456789abcdef
          MEDIA_STORAGE_DIR: /tmp/video-marketplace-media
      - run: npm run test:admin-payout-concurrency-regression
