name: Format HTML file only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format demo index only
        run: |
          npx --yes prettier@3.6.2 --write demo/index.html
      - name: Commit formatted file only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "Format demo index HTML only"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/format-html-only.yml
          git add .github/workflows/format-html-only.yml
          git commit -m "Remove temporary HTML format workflow"
          git push
