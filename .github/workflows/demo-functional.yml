name: Demo Functional E2E

on:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-functional.yml'
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-functional.yml'

jobs:
  functional-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start demo server
        working-directory: demo
        run: node launcher.mjs > /tmp/vidora-demo.log 2>&1 &
      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vidora-demo.log
          exit 1
      - name: Run functional demo E2E
        working-directory: demo
        run: npm run verify
      - name: Run polished showcase acceptance
        run: npm run demo:showcase
