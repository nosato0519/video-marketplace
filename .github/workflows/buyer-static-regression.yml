name: Buyer Static Regression

on:
  push:
    paths:
      - 'pages/buyer.html'
      - 'pages/watch.html'
      - 'pages/favorites.html'
      - 'pages/library.html'
      - 'pages/purchase-history.html'
      - 'pages/order-detail.html'
      - 'pages/cart.html'
      - 'tests/buyer-account-static.test.js'
      - 'pages/buyer-register.html'
      - 'pages/account-settings.html'
      - 'app/checkout/checkout-api.js'
      - 'pages/buyer-login.html'
      - 'pages/checkout.html'
      - 'pages/product-detail.html'
      - 'app/auth/auth-api.js'
      - 'backend/src/auth-routes.js'
      - 'backend/src/auth/load-session-user.js'
      - 'backend/migrations/032_user_display_name.sql'
      - '.github/workflows/buyer-static-regression.yml'
  pull_request:
    paths:
      - 'pages/buyer.html'
      - 'pages/watch.html'
      - 'pages/favorites.html'
      - 'pages/library.html'
      - 'pages/purchase-history.html'
      - 'pages/cart.html'
      - 'pages/account-settings.html'
      - 'pages/buyer-login.html'
      - 'pages/checkout.html'
      - 'pages/product-detail.html'
      - 'app/checkout/checkout-api.js'
      - 'tests/buyer-account-static.test.js'
      - 'pages/buyer-register.html'
      - 'app/auth/auth-api.js'
      - 'backend/src/auth-routes.js'
      - 'backend/src/auth/load-session-user.js'
      - 'backend/migrations/032_user_display_name.sql'
      - '.github/workflows/buyer-static-regression.yml'

jobs:
  buyer-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Buyer account/order/library static contract test
        run: node tests/buyer-account-static.test.js
