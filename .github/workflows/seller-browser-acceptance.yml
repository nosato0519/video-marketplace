name: Seller Browser Acceptance

on:
  push:
    paths:
      - 'app/**'
      - 'tests/browser-seller-acceptance.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/seller-browser-acceptance.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/browser-seller-acceptance.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/seller-browser-acceptance.yml'

jobs:
  seller-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Seller browser acceptance
        run: npx playwright test tests/browser-seller-acceptance.spec.js --project=chromium
