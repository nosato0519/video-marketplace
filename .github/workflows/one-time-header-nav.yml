name: One-time header nav update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update header nav
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="nav-right"><a class="system" href="#guide">システムを見る</a><a class="sell" href="#creator">ログイン</a></div>'
          new = '<div class="nav-right"><a class="system" href="#creator">販売者デモ</a><a class="system" href="#popular">購入者デモ</a><a class="sell" href="#creator">ログイン</a></div>'
          if old not in s:
              raise SystemExit('target header not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit header update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html
          git commit -m "Add seller and buyer demo links"
          git push
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/one-time-header-nav.yml
          git add .github/workflows/one-time-header-nav.yml
          git commit -m "Remove one-time header workflow"
          git push
