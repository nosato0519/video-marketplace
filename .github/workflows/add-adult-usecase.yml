name: Add adult use case
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only adult tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span>企業研修</span></div></div></section><section class="section" id="collection">'
          new = '<span>企業研修</span><span>アダルト</span></div></div></section><section class="section" id="collection">'
          if old not in s:
              raise SystemExit('target not found; no change made')
          if '<span>アダルト</span>' in s:
              raise SystemExit('adult already present; no change made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit exact one-line change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/index.html
          git diff --cached --check
          git commit -m 'Add adult to video use cases'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/add-adult-usecase.yml
          git add .github/workflows/add-adult-usecase.yml
          git commit -m 'Remove temporary adult use case workflow'
          git push
