<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard Browser Smoke</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#f7f7f8;color:#171a1f}.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;margin:8px 0}.ok{color:#16733d}.fail{color:#a11}.muted{color:#666}button{padding:8px 12px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer}a{color:inherit}</style></head><body><h1>Seller Dashboard Browser Smoke</h1><p class="muted">Run this page from the same origin while authenticated as a seller. It checks the browser-visible API boundary without bypassing server authorization.</p><div id="results" class="panel">Preparing…</div><div class="panel"><a href="/seller/dashboard.html">Open Seller Dashboard</a></div><script>
const out=document.getElementById('results');
async function check(label,url){const started=performance.now();try{const r=await fetch(url,{credentials:'same-origin',headers:{Accept:'application/json'}});const text=await r.text();let data=null;try{data=JSON.parse(text)}catch{};const ok=r.status>=200&&r.status<300;return {label,status:r.status,ok,time:Math.round(performance.now()-started),detail:ok?'JSON response received':(data?.error?.message||data?.error||`HTTP ${r.status}`)}}catch(e){return {label,status:'—',ok:false,time:Math.round(performance.now()-started),detail:e.message}}}
(async()=>{const checks=await Promise.all([check('Seller profile','/api/seller/profile'),check('Seller earnings','/api/seller/earnings'),check('Seller payouts','/api/seller/payouts')]);out.innerHTML=checks.map(x=>`<div class="row ${x.ok?'ok':'fail'}"><strong>${x.ok?'PASS':'FAIL'}</strong> ${x.label} — HTTP ${x.status} — ${x.time}ms — ${String(x.detail).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>`).join('')+`<hr><p class="muted">This smoke harness does not assert a browser pass when no authenticated seller session exists. A 401/403 response is expected for unauthenticated/non-seller sessions.</p>`})()
</script></body></html>
