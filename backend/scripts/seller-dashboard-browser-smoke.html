<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard Browser Smoke</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#f7f7f8;color:#171a1f}.panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;margin:8px 0}.ok{color:#16733d}.fail{color:#a11}.muted{color:#666}button{padding:8px 12px;border:1px solid #ccc;border-radius:7px;background:#fff;cursor:pointer}a{color:inherit}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style></head><body><h1>Seller Dashboard Browser Smoke</h1><p class="muted">Run this page from the same origin. Choose the expected session state before running. The test never bypasses server authorization.</p><div class="controls"><button id="sellerMode">Seller session</button><button id="boundaryMode">Unauthenticated / non-seller boundary</button></div><div id="mode" class="muted">Mode: seller session</div><div id="results" class="panel">Ready.</div><div class="panel"><a href="/seller/dashboard.html">Open Seller Dashboard</a></div><script>
const out=document.getElementById('results'),modeEl=document.getElementById('mode');let mode='seller';
const endpoints=[['Seller profile','/api/seller/profile'],['Seller earnings','/api/seller/earnings'],['Seller payouts','/api/seller/payouts']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function check(label,url){const started=performance.now();try{const r=await fetch(url,{credentials:'same-origin',headers:{Accept:'application/json'}});const text=await r.text();let data=null;try{data=JSON.parse(text)}catch{};const statusOk=mode==='seller'?r.status>=200&&r.status<300:(r.status===401||r.status===403);return {label,status:r.status,ok:statusOk,time:Math.round(performance.now()-started),detail:statusOk?'Expected response received':(data?.error?.message||data?.error||`HTTP ${r.status}`)}}catch(e){return {label,status:'—',ok:false,time:Math.round(performance.now()-started),detail:e.message}}}
async function run(){out.textContent='Running…';const checks=await Promise.all(endpoints.map(([label,url])=>check(label,url)));const passed=checks.filter(x=>x.ok).length;out.innerHTML=`<p><strong>${passed}/${checks.length} checks passed</strong></p>`+checks.map(x=>`<div class="row ${x.ok?'ok':'fail'}"><strong>${x.ok?'PASS':'FAIL'}</strong> ${esc(x.label)} — HTTP ${esc(x.status)} — ${x.time}ms — ${esc(x.detail)}</div>`).join('')+`<hr><p class="muted">Seller mode requires an authenticated seller session and expects 2xx. Boundary mode intentionally expects 401/403 and verifies protected endpoints are not anonymously readable.</p>`}
document.getElementById('sellerMode').onclick=()=>{mode='seller';modeEl.textContent='Mode: seller session';run()};document.getElementById('boundaryMode').onclick=()=>{mode='boundary';modeEl.textContent='Mode: unauthenticated / non-seller boundary';run()};run();
</script></body></html>
