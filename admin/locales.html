<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Languages</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#171a1f;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:0 auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.muted{color:#69717d}.panel{background:#fff;border:1px solid #e2e5e9;border-radius:12px;padding:20px;margin-bottom:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f2}th{font-size:12px;text-transform:uppercase;color:#69717d}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#eef1f4}.status.on{background:#e7f5ec}.btn{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}.btn.primary{background:#11151a;color:#fff;border-color:#11151a}.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}input{width:100%;padding:10px;border:1px solid #d7dce2;border-radius:7px}@media(max-width:800px){.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top"><div><h1>Languages</h1><div class="muted">Manage customer-facing locales. Default language cannot be disabled.</div></div><a href="/" class="btn">Storefront</a></div>
    <section class="panel"><h2>Add or enable a language</h2><p class="muted">Use a BCP 47 locale such as <code>nl</code>, <code>sv</code>, <code>pl</code>, <code>ar</code> or <code>th</code>.</p><form id="localeForm" class="form"><input id="locale" placeholder="Locale (e.g. es-MX)" required><input id="languageName" placeholder="English name" required><input id="nativeName" placeholder="Native name" required><button class="btn primary">Save</button></form><p id="message" class="muted" role="status"></p></section>
    <section class="panel"><h2>Configured languages</h2><table><thead><tr><th>Locale</th><th>Language</th><th>Native</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody></table></section>
  </main>
  <script>
    const rows=document.getElementById('rows'),message=document.getElementById('message');
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function load(){
      try{const r=await fetch('/api/admin/locales',{credentials:'same-origin'});if(!r.ok)throw new Error('Unable to load languages');const data=await r.json();rows.innerHTML=data.map(x=>`<tr><td><code>${esc(x.locale)}</code></td><td>${esc(x.languageName)}</td><td>${esc(x.nativeName)}</td><td><span class="status ${x.enabled?'on':''}">${x.enabled?'Enabled':'Disabled'}${x.isDefault?' · Default':''}</span></td><td>${x.isDefault?'—':`<button class="btn" data-locale="${esc(x.locale)}" data-enabled="${!x.enabled}">${x.enabled?'Disable':'Enable'}</button>`}</td></tr>`).join('')||'<tr><td colspan="5">No locales configured.</td></tr>';
        document.querySelectorAll('[data-locale]').forEach(b=>b.addEventListener('click',()=>toggle(b.dataset.locale,b.dataset.enabled==='true')));
      }catch(e){rows.innerHTML=`<tr><td colspan="5">${esc(e.message)}</td></tr>`}}
    async function toggle(locale,enabled){const r=await fetch('/api/admin/locales/'+encodeURIComponent(locale),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});if(!r.ok){message.textContent='Could not update the language.';return}message.textContent='Language updated.';load()}
    document.getElementById('localeForm').addEventListener('submit',async e=>{e.preventDefault();message.textContent='Saving…';const body={locale:locale.value.trim(),languageName:languageName.value.trim(),nativeName:nativeName.value.trim()};const r=await fetch('/api/admin/locales',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});message.textContent=r.ok?'Language saved.':'Could not save language.';if(r.ok){e.target.reset();load()}});
    load();
  </script>
</body>
</html>
