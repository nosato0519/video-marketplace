<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account — Video Market</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.panel{background:#12161b;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.muted{color:#9aa4af}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}th{font-size:11px;color:#9aa4af;text-transform:uppercase}.error{padding:12px;border:1px solid #733;border-radius:8px;color:#f5b7b7}.empty{padding:24px 0}.status{font-size:12px;border-radius:999px;padding:4px 8px;background:#20262d}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><main class="wrap"><header class="top"><div><h1>My Account</h1><p class="muted">Manage your purchases and access your purchased videos.</p></div><div class="actions"><a class="btn" href="/">Storefront</a><a class="btn primary" href="/library.html">My Library</a></div></header><div id="message"></div><div class="grid"><section class="panel"><h2>Recent orders</h2><div id="orders"><div class="muted">Loading…</div></div><div class="actions"><a class="btn" href="/orders.html">View all orders</a></div></section><section class="panel"><h2>Library</h2><div id="library"><div class="muted">Loading…</div></div><div class="actions"><a class="btn primary" href="/library.html">Open Library</a></div></section></div></main><script>
const orders=document.getElementById('orders'),library=document.getElementById('library'),message=document.getElementById('message');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401){throw new Error('Please log in to view your account.')}if(!r.ok)throw new Error(d.error?.message||d.error||'Unable to load account');return d}
async function load(){try{const [o,l]=await Promise.all([api('/api/orders'),api('/api/library')]);const oi=o.items||[];const li=l.items||[];orders.innerHTML=oi.length?`<table><thead><tr><th>Product</th><th>Status</th><th>Date</th></tr></thead><tbody>${oi.slice(0,5).map(x=>`<tr><td>${esc(x.title||x.product_title||x.product_id)}</td><td><span class="status">${esc(x.status)}</span></td><td>${esc(x.created_at||x.purchased_at||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty muted">No orders yet.</div>';library.innerHTML=li.length?`<p>${li.length} purchased video${li.length===1?'':'s'} available in your Library.</p>`:'<div class="empty muted">No purchased videos yet.</div>'}catch(e){message.innerHTML='<p class="error">'+esc(e.message)+'</p>';orders.innerHTML='';library.innerHTML='' }}load();
</script></body></html>
