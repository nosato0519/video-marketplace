<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Video Market</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:36px 20px}.back{color:#9aa4af;text-decoration:none}.card{margin-top:22px;background:#12161b;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:24px}.hero{aspect-ratio:16/7;background:#1a1f26;border-radius:10px;display:grid;place-items:center;color:#78828d}.price{font-size:28px;font-weight:800}.muted{color:#9aa4af;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;border-radius:9px;padding:11px 16px;cursor:pointer;text-decoration:none}.primary{background:#fff;color:#090b0e;border-color:#fff;font-weight:700}.error{color:#f0aaaa}.success{color:#a9ddb9}</style></head><body><main class="wrap"><a class="back" href="/">← Back to Discover</a><article id="product" class="card"><div class="hero">VIDEO PREVIEW</div><h1 id="title">Loading…</h1><p id="seller" class="muted"></p><p id="description" class="muted"></p><div id="price" class="price"></div><div class="actions"><button id="buy" class="btn primary" disabled>Buy now</button><a class="btn" href="/library.html">My Library</a></div><p id="message" class="muted"></p></article></main><script>
const id=new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('productId');const title=document.getElementById('title'),seller=document.getElementById('seller'),description=document.getElementById('description'),price=document.getElementById('price'),buy=document.getElementById('buy'),message=document.getElementById('message');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error?.message||d.error||'Request failed');return d}
async function load(){if(!id){message.textContent='Product ID is missing.';return}try{const d=await api('/api/catalog/products/'+encodeURIComponent(id)+'?locale='+encodeURIComponent(localStorage.getItem('locale')||'en'));const p=d.data||d;title.textContent=p.title||'Untitled';seller.textContent=p.seller_name?`By ${p.seller_name}`:'';description.textContent=p.description||'';price.textContent=`${p.price_currency||'USD'} ${Number(p.price_amount||0).toFixed(2)}`;buy.disabled=false}catch(e){title.textContent='Unable to load product';message.className='error';message.textContent=e.message}}
buy.onclick=async()=>{buy.disabled=true;message.className='muted';message.textContent='Creating your order…';try{const order=await api('/api/orders',{method:'POST',body:JSON.stringify({productId:id})});const o=order.data||order;const checkout=await api('/api/checkout',{method:'POST',body:JSON.stringify({orderId:o.id})});const url=checkout.checkout_url||checkout.url||checkout.data?.checkout_url;if(!url)throw Error('Checkout URL was not returned.');location.href=url}catch(e){message.className='error';message.textContent=e.message;buy.disabled=false}};load();
</script></body></html>
